# [profile.ci] is the LIVE CI profile, not an experiment: ci.yml:263
# (`workspace-test`) runs `cargo nextest run --profile ci` since the
# PF-C1 flip (2026-09-04) and nothing else runs this file. The
# `lance-heavy` override below (test-threads=1 for
# `binary(memo) | test(atlas)`) applies ONLY in CI, so a green local
# `cargo test` is NOT evidence the CI timeout holds.

[profile.ci]
test-threads = 4
retries = 0
slow-timeout = { period = "120s", terminate-after = 3 }

# v0.44 F1 -- machine-readable report for scripts/ci/witness.py: the lane is
# decided from this file (failed == 0 and executed >= the nextest floor in
# ci/test-floors.toml), not from nextest's exit code alone. Written to
# target/nextest/ci/junit.xml.
[profile.ci.junit]
path = "junit.xml"

# v0.44 X5 -- the code-test lane (kb-code-server + kb-code-cli + kb-lip) runs
# under its own profile so its junit report lands in its own directory
# (target/nextest/ci-code/junit.xml) and is witnessed against the `code-nextest`
# floor. It inherits the ci timeouts/threads; it has no overrides of its own.
[profile.ci-code]
inherits = "ci"

[profile.ci-code.junit]
path = "junit.xml"

[test-groups]
lance-heavy = { max-threads = 1 }

[[profile.ci.overrides]]
# PF-C1 — the three standalone binaries this filter originally named
# (atlas_backfill / atlas_points_memo / facets_memo) were consolidated
# into the crates/kb-server/tests/memo/ dir-harness (one link unit,
# binary name `memo`); the old names matched NOTHING, so the lance-heavy
# serialization silently stopped applying to them.
filter = 'binary(memo) | test(atlas)'
test-group = 'lance-heavy'
