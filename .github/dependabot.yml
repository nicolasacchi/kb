# Dependabot — automated dependency PRs for every ecosystem in the repo.
# Minor/patch bumps are grouped into one PR per ecosystem to limit noise;
# majors come as individual PRs (they may need code changes). github-actions
# is included so the SHA-pinned actions in .github/workflows stay current
# (Dependabot bumps the SHA and its `# vX` comment together).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      e2e-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web-code"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-code-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # react-router 8 hard-requires `react >=19.2.7`; web-code is still on
      # the React 18 line (react/react-dom ^18.3.1, @types/* ^18.3.x) and
      # the React 19 migration is a separate, much larger piece of work
      # than a dependency bump. Without this, Dependabot keeps opening a
      # react-router 8 PR that can only ever be `npm install`-red with
      # ERESOLVE (it did on 2026-09-28: PR #174, 7.18.3 -> 8.4.0).
      #
      # Scoped to 8.x on purpose: 7.x minor/patch updates stay in the
      # web-code-minor-patch group and keep landing. Drop this line only
      # once web-code is on React >=19.2.7 — and when react-router 9
      # ships, check its react peer before letting it through.
      - dependency-name: "react-router"
        versions: ["8.x"]
      # The React 19 move is deferred, and the set is COUPLED: all four of
      # these must land together or none can install. Dependabot splits one
      # move into a PR per package name, and each half fails on its own —
      # #110 (react + @types/react) died on "@types/react-dom@18.3.7 peer
      # @types/react@^18", #106 (react-dom + @types/react-dom) on the mirror
      # image — and they conflict with each other (4 hunks across package.json
      # and the lock), so neither can go first. `dependency-name` matches the
      # EXACT manifest name, so "react" does not cover "@types/react": without
      # all four entries here, a weekly run still opens a 19.x @types PR that
      # reproduces exactly this ERESOLVE.
      #
      # `ignore.versions` is a semver RANGE matched against the TARGET
      # version, so "19.x" is >=19 <20 and does not leak into a 20.x. Nothing
      # here suppresses 7.x react-router, or any 18.x of these four, so the
      # minor/patch stream that actually works keeps landing.
      #
      # For the record, the deferral is a JUDGEMENT, not a blocker: the break
      # surface is small (the global `JSX` namespace at RecipeResultViews.tsx:23
      # and TimelinePanel.tsx:54 is the only hard compile break — `React.JSX.Element`
      # fixes it; `act` from react-dom/test-utils is deprecated, not removed, and
      # there are no useRef()/ReactDOM.render/defaultProps sites to migrate). It
      # is worth doing deliberately rather than as four dependabot PRs, not
      # because it is large.
      - dependency-name: "react"
        versions: ["19.x"]
      - dependency-name: "react-dom"
        versions: ["19.x"]
      - dependency-name: "@types/react"
        versions: ["19.x"]
      - dependency-name: "@types/react-dom"
        versions: ["19.x"]

  - package-ecosystem: npm
    directory: "/web-code/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-code-e2e-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain's TAGS ARE TOOLCHAIN VERSIONS, not action
      # releases: `@1.96.0` means "install Rust 1.96.0", and the tag is
      # re-pointed as new Rust versions ship. Dependabot reads them as
      # ordinary semver and bumps to the newest tag it can see, silently
      # re-pinning the compiler. On 2026-08-12 it opened a PR moving every
      # job to `@1.100.0`; each one died in ~15 seconds on a 404 from
      # static.rust-lang.org for a Rust that does not exist.
      #
      # The toolchain is pinned deliberately and in ONE place —
      # rust-toolchain.toml (1.96.0) — with the action's ref kept in step by
      # hand so local `rustup` auto-switch and CI can never disagree about
      # which clippy is authoritative. Bump both together, manually.
      - dependency-name: "dtolnay/rust-toolchain"
