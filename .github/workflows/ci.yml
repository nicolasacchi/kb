    timeout-minutes: 20
    # No `needs:` — pure-TS unit tests don't touch the Rust build, so they
    # give fast independent feedback on the SPA's logic (config deep-merge,
    # lib/ derivations, sort/group helpers). The e2e job covers the bundle.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Audit production deps (high+ severity)
        working-directory: web
        # Gate on serious PRODUCTION-dependency advisories only. Dev/build-tool
        # vulns (e.g. vite — Windows-specific) are --omit=dev so they don't block
        # CI; Dependabot surfaces those for a deliberate bump instead.
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck (tsc -b, includes *.test.ts)
        working-directory: web
        run: npm run typecheck

      - name: Unit tests (vitest, TZ-pinned)
        working-directory: web
        run: npm test

