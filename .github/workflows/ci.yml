    #     code-* job (drop `-D warnings`, repoint a `run:`) and still have
    #     all five report success: the gate and its own off-switch were the
    #     same unprotected file.
    runs-on: ubuntu-latest
    # 26.5 min cold (19.8 of it compiling, 5.7 running) once clippy and the
    # SPA moved to their own jobs. The old single `code` job was widened
    # 60->90 in 2026-08 after a run finished the real work inside the wall
    # and then had its POST-JOB cache save (a `tar` of target/ + the cargo
    # registry) hard-cancelled at 60m, reporting a green job as a failure —
    # this is the job that inherited that save, so it keeps the headroom.
    # `cargo nextest` here is the same command as `just ci-code`'s nextest line,
    # followed by the same --doc step (nextest skips doctests) — keep the two
    # in lock-step (the sibling `code-lint` job runs its first).
    #
    # V70-A5 — this lane is ALSO the kbc-cmd/1 registry gate: `kb-code
    # commands doctor` runs as a `#[test]` inside kb-code-cli
    # (`command_registry_passes_doctor`), so the sweep below fails the build
    # on registry drift (a stale CLI twin, a claimed browser chord, a global
    # key redeclared narrower, an Esc row with no dismiss order, an
    # unratified conflict).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the BASE_SHA..HEAD_SHA diff below is reachable
          # (actions/checkout's default shallow fetch only guarantees HEAD).
          fetch-depth: 0

      - name: Check for kb-code-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/code-changed.sh

      - name: Free disk space (drop preinstalled SDKs)
        if: steps.changes.outputs.run == 'true'
        # Same reclaim as the `workspace-lint` job — see its comment.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        # Reads the version from rust-toolchain.toml (single source; see
        # .github/actions/setup-rust/action.yml) — no per-job literal to drift.
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: code
          # Only main writes the cache — see the CACHING note at the top.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep via kb-core)
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install cargo-nextest
        if: steps.changes.outputs.run == 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run --profile ci-code (kb-code + kb-lip)
        # v0.44 X5 (F1 carry): this lane used `cargo test`, so its pass count
        # was never witnessed -- a harness that silently ran half the tests
        # stayed green. nextest writes a junit report (.config/nextest.toml
        # [profile.ci-code.junit]) that the Witness step below decides the lane
        # from, exactly as `workspace-test` does for the rest of the workspace.
        if: steps.changes.outputs.run == 'true'
        run: cargo nextest run --locked --profile ci-code --no-fail-fast -p kb-code-server -p kb-code-cli -p kb-lip

      - name: Witness (nextest junit -> floor + zero failures)
        # `--only-if` is this lane's own path-filter output: a legitimately
        # skipped lane is "skipped", not "0 of N tests".
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/witness.py nextest-junit target/nextest/ci-code/junit.xml --lane code-nextest --only-if "${{ steps.changes.outputs.run }}"

      - name: cargo test --doc (kb-code + kb-lip)
        # nextest does not run doctests; the `cargo test` it replaced did.
        if: steps.changes.outputs.run == 'true'
        run: cargo test --locked --doc -p kb-code-server -p kb-code-cli -p kb-lip

      - name: Skipped (no kb-code-relevant changes)
        if: steps.changes.outputs.run != 'true'
        run: scripts/ci/code-changed.sh --skip-message

  code-spa:
    permissions:
      contents: read
    name: code-spa (web-code build + theme lint + vitest)
    # kb-code is a separate sibling daemon+SPA pair inside this workspace
    # (design v4, "The read-first IDE" — research kb corpus); kb-lip
    # (design-lip.md, Track L1) is its own standalone opt-in LSP
    # intelligence adapter, linted/tested in the SAME lane because it's
    # kb-code-adjacent (talked to over lip/1 HTTP by kb-code-server, L2 —
    # never linked).
    # Paths-filtered: only actually builds when kb-code's own crates, kb-lip,
    # its SPA, or something that could affect any crate's resolution/build
    # shape (root Cargo.toml, Cargo.lock, the justfile), changed. The filter
    # is `scripts/ci/code-changed.sh` (no third-party paths-filter action to
    # pin/trust — same reasoning as dco.yml; v0.44 F1 moved it out of five
    # pasted inline copies whose skip messages had already drifted, and made
    # it SIGPIPE-proof — see the script header) and gates each step via `if:`, not a
    # job-level `if:`, so the job itself always reports success/failure (safe
    # to mark as a required check; a job-level skip can leave a required
    # check permanently pending). All FIVE `code-*` jobs (code-drift,
    # code-lint, code-test, code-spa, code-e2e) call the SAME script
    # (`just ci-selfcheck` asserts it). Each entry is there because a job below actually reads that
    # path, not because the crate sounds related:
    #   crates/kb-core/, crates/kb-server/ — kb-code-server path-depends on
    #     both, so a change to either can break the only jobs that compile
    #     or test kb-code.
    #   plugins/kb-code/ — code-test/code-lint EXECUTE
    #     plugins/kb-code/hooks/kb-code-annotations.sh (and the codex twin)
    #     as real subprocesses; see annotations_hook.rs's hook_script_path.
    #   web/ — web-code/src/lib/iconParity.test.ts readFileSync's
    #     web/src/components/icons.tsx and asserts the shared glyph SVG
    #     bodies are byte-identical, so a web/-only PR would otherwise skip
    #     the only job that catches icon divergence.
    #   scripts/review-store/ — code-test executes
    #     scripts/review-store/review_snapshot.py and asserts it against
    #     scripts/review-store/fixtures/golden-review-snapshot.json
    #     (tests/review/rs_u0_golden.rs), so a fixture-only edit skipped
    #     the very test that exists to catch it.
    #   rust-toolchain.toml — it decides which rustc the skipped jobs would
    #     have compiled with, so a bump changes the toolchain
    #     every job installs (via `.github/actions/setup-rust`, which reads it);
    #     `toolchain-pin-check` (supply-chain) asserts nothing bypasses that.
    #   .github/workflows/ci.yml — the file that DEFINES this filter. If a
    #     PR's only diff is this file, it used to be able to neuter every
    #     code-* job (drop `-D warnings`, repoint a `run:`) and still have
    #     all five report success: the gate and its own off-switch were the
    #     same unprotected file.
    runs-on: ubuntu-latest
    # SPLIT out of the old `code` job (2026-09-06). `just ci-code-spa` is
    # node-only — npm ci + vite build + the kbc-theme/1 contrast oracle +
    # 1840 vitest tests measured 0.5 min end to end — so it has no business
    # queueing behind a 25-minute Rust compile. No Rust toolchain, no
    # protoc, no rust-cache and (nothing compiles here) no free-disk step.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the BASE_SHA..HEAD_SHA diff below is reachable
          # (actions/checkout's default shallow fetch only guarantees HEAD).
          fetch-depth: 0

      - name: Check for kb-code-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/code-changed.sh

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install just
        if: steps.changes.outputs.run == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: just ci-code-spa
        if: steps.changes.outputs.run == 'true'
        # KB_WITNESS_DIR -> web-code/vitest.config.ts adds the JSON reporter.
        env:
          KB_WITNESS_DIR: ${{ runner.temp }}/witness
        run: just ci-code-spa

      - name: Witness (vitest JSON report -> floor + zero failures)
        # `--only-if` is this lane's own path-filter output: a legitimately
        # skipped lane is "skipped", not "0 of N tests".
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/witness.py vitest "$RUNNER_TEMP/witness/vitest-web-code.json" --lane web-code-vitest --only-if "${{ steps.changes.outputs.run }}"

      - name: Audit web-code production deps (high+ severity)
        if: steps.changes.outputs.run == 'true'
        working-directory: web-code
        # Same gate and SAME flags as `web-unit`'s audit for web/ (ci.yml
        # below): web-code is a separate npm tree with its own
        # package-lock.json, and until this step existed nothing in CI
        # audited it — a high-sever advisory in one of its 10 production
        # deps (CodeMirror 6, React 18, @tanstack/react-query 5,
        # react-router 7) landed green because only web/ was checked.
        # The lane is the right home: `ci-code-spa` is node-only, runs
        # whatever changed under web-code/, and is where a bad web-code
        # dependency is actually noticed. Runs AFTER `just ci-code-spa`
        # because that recipe already did `npm ci` for this exact tree —
        # `npm audit` resolves the lockfile and posts it to the registry
        # advisory endpoint, so a second install would buy nothing.
        # Dependabot's web-code updates ride the same lane (they touch
        # web-code/package.json, which the filter matches).
        run: npm audit --audit-level=high --omit=dev

      - name: Skipped (no kb-code-relevant changes)
        if: steps.changes.outputs.run != 'true'
        run: scripts/ci/code-changed.sh --skip-message

  code-e2e:
    permissions:
      contents: read
      # actions: read -> `gh run download` of the previous main run's witness
      # report (flaky-twice detection, scripts/ci/witness.py --prev).
      actions: read
    name: code-e2e (kb-code Search-Everywhere Playwright smoke)
    # Runs `just ci-code-e2e` (a fast-profile kb-code-server build + web-code/e2e/'s
    # own Playwright suite, driven against a fresh git fixture repo) — mirrors
    # the root `e2e` job in shape (same runner, same disk-space/toolchain/
    # protoc/node setup) but for kb-code's sibling daemon+SPA. It caches
    # its OWN Playwright browsers (a `code-`-prefixed key — see the cache
    # step) and `just ci-code-e2e` still runs `npx playwright install
    # chromium --with-deps` itself, which then finds the binaries already
    # present and skips the ~150 MB download. Path-filtered with the SAME
    # change-detection pattern as the `code-*` jobs above (their own comment
    # explains why the filter gates each step via `if:` rather than a
    # job-level `if:`).
    runs-on: ubuntu-latest
    # 60 -> 90 for 4 vCPU (fast-profile kb-code-server + a browser download
    # + the suite). No `needs:`, same reason as `e2e`. 27.3 min cold; the
    # OWN `code-e2e-fast` cache family below should take the warm case from
    # the measured 20.1 to ~11.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the BASE_SHA..HEAD_SHA diff below is reachable
          # (actions/checkout's default shallow fetch only guarantees HEAD).
          fetch-depth: 0

      - name: Check for kb-code-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/code-changed.sh

      - name: Free disk space (drop preinstalled SDKs)
        if: steps.changes.outputs.run == 'true'
        # Same rationale as the root `e2e` job: a fast-profile binary +
        # Chromium, and a kb-code-server daemon booting against a fresh git
        # fixture repo.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # OWN family, not `e2e-fast` (2026-09-06): the two Playwright
          # lanes build DIFFERENT fast-profile binaries, and the `e2e` job
          # (the shorter of the two) always won the shared save race — so
          # kb-code's gix/tree-sitter graph was never in the entry this job
          # restored, and warm bought it only 7 of its 27 minutes. See the
          # CACHING note at the top.
          shared-key: code-e2e-fast
          # Only main writes the cache — see the CACHING note at the top.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep via kb-core)
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install just
        if: steps.changes.outputs.run == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The `e2e` job's two browser-cache steps, copied (path, key shape
      # and version-detection) rather than reinvented — this job was
      # re-downloading Chromium on every single run.
      - name: Resolve Playwright version (browser-cache key)
        id: playwright-version
        if: steps.changes.outputs.run == 'true'
        working-directory: web-code/e2e
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # `code-` in the key, NOT a shared entry with `e2e`'s
          # `playwright-<os>-<version>`. Today the two keys differ anyway,
          # because the suites are on different Playwright lines:
          # tests/e2e pins ^1.63.0 and resolves 1.63.0, web-code/e2e pins
          # ^1.62.1 and resolves 1.62.1. The prefix is what keeps them
          # separate if a bump ever re-converges them — and it is the
          # content difference that would bite then, not the version:
          # `e2e` caches chromium+firefox while this job only ever installs
          # chromium, and an Actions cache entry is immutable, so whoever
          # saves first owns the key forever and the other job silently
          # re-downloads its missing browser every run.
          key: playwright-code-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Previous main code-e2e report (flaky-twice check input)
        # Same contract as the root `e2e` job's step of the same name.
        if: ${{ !cancelled() && github.event_name == 'push' && steps.changes.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id="$(gh run list --branch main --workflow ci.yml --status success --event push -L 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$id" ] && gh run download "$id" -n witness-code-e2e -D "$RUNNER_TEMP/prev"; then
            echo "previous main report: run $id"
          else
            echo "no previous main code-e2e witness report available (run '$id'); flaky-twice check skipped"
          fi

      - name: just ci-code-e2e
        if: steps.changes.outputs.run == 'true'
        # KB_WITNESS_DIR -> web-code/e2e/playwright.config.ts adds the JSON reporter.
        env:
          KB_WITNESS_DIR: ${{ runner.temp }}/witness
        run: just ci-code-e2e

      - name: Witness (Playwright JSON report -> floor + zero failures)
        if: ${{ !cancelled() }}
        run: |
          prev=()
          if [ "${{ github.event_name }}" = push ] && [ -f "$RUNNER_TEMP/prev/pw-code-e2e.json" ]; then
            prev=(--prev "$RUNNER_TEMP/prev/pw-code-e2e.json" --fail-repeat-flaky)
          fi
          python3 scripts/ci/witness.py playwright "$RUNNER_TEMP/witness/pw-code-e2e.json" --lane code-e2e --only-if "${{ steps.changes.outputs.run }}" "${prev[@]}"

      - name: Upload witness report
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-code-e2e
          path: ${{ runner.temp }}/witness
          retention-days: 14
          if-no-files-found: warn

      - name: Skipped (no kb-code-relevant changes)
        if: steps.changes.outputs.run != 'true'
        run: scripts/ci/code-changed.sh --skip-message

  web-unit:
    permissions:
      contents: read
    name: web (vitest + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `needs:` — pure-TS unit tests don't touch the Rust build, so they
    # give fast independent feedback on the SPA's logic (config deep-merge,
    # lib/ derivations, sort/group helpers). The e2e job covers the bundle.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Audit production deps (high+ severity)
        working-directory: web
        # Gate on serious PRODUCTION-dependency advisories only. Dev/build-tool
        # vulns (e.g. vite — Windows-specific) are --omit=dev so they don't block
        # CI; Dependabot surfaces those for a deliberate bump instead.
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck (tsc -b, includes *.test.ts)
        working-directory: web
        run: npm run typecheck

      - name: Unit tests (vitest, TZ-pinned)
        # KB_WITNESS_DIR -> web/vitest.config.ts adds the JSON reporter.
        env:
          KB_WITNESS_DIR: ${{ runner.temp }}/witness
        working-directory: web
        run: npm test

      - name: Witness (vitest JSON report -> floor + zero failures)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/witness.py vitest "$RUNNER_TEMP/witness/vitest-web.json" --lane web-vitest

  hook-omp:
    permissions:
      contents: read
    name: hooks (omp extension, bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `needs:` - a bash + bun lane over fake-`kb` fixtures; it never
    # touches the Rust build. v0.44 X6: kb-omp.ts's env/identity/slate tests
    # used to SKIP wherever bun was absent (i.e. in CI), so they pinned
    # nothing. KB_REQUIRE_BUN=1 turns an absent bun into a failure.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install bun
        run: npm install --global bun@1.2.23

      - name: kb-omp.ts tests (bun)
        env:
          KB_REQUIRE_BUN: "1"
        run: |
          bun --version
          bash plugins/kb-memory/hooks/tests/test-omp-slate.sh

  supply-chain:
    permissions:
      contents: read
    name: supply-chain (cargo-deny — licenses + advisories)
    runs-on: ubuntu-latest
    # 30, not 20: no compile happens here, but a cold hosted runner still
    # downloads the crates.io index and the RustSec advisory DB first.
    timeout-minutes: 30
    # No `needs:` — cargo-deny reads Cargo.lock + the RustSec DB; it does NOT
    # build the workspace, so it's fast and independent of the Rust jobs. We
    # install a pinned prebuilt cargo-deny (no source build) via
    # taiki-e/install-action. Splitting advisories from licenses+bans+sources keeps an
    # advisory-DB hiccup from masking a real license regression. Mirrors the
    # local `just deny` recipe; config is deny.toml (cargo-deny v2 schema).
    #
    # This job is also the home of the OTHER compile-free gates — the NOTICE
    # drift check, the doc line-anchor gate (O11) and the CI toolchain-pin
    # assertion (O8). That is not scope creep into a license job: it is the
    # one lane in this file that is explicitly "no compile happens here", so
    # a text assertion added there costs seconds and a text assertion added
    # anywhere else costs a compile. The job's `name:` still reads
    # "cargo-deny — licenses + advisories" because that string is a required
    # check in branch protection and renaming it would silently drop the
    # protection rule; the steps below it are the authority on what runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install the prebuilt cargo-deny binary directly
      # (taiki-e/install-action fetches a release binary) instead of the
      # Docker-based cargo-deny-action — one less container image to pull
      # and trust, and it works identically on any runner.
      # cargo-deny still shells out to `cargo metadata` to resolve the dependency
      # graph, so a toolchain must be on PATH (the old action bundled one inside
      # its container). We only resolve Cargo.lock here — never compile.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      # cargo-about is the same shape as cargo-deny: a prebuilt release binary
      # via taiki-e/install-action, no source build. Installed from source it
      # would need `--features cli` (justfile:47) and a full compile — which
      # this job must never do.
      #
      # The version is PINNED, and it has to be. Unpinned, this job installed
      # cargo-about `latest` and the NOTICE gate below compared a render made
      # by one tool version against a file committed by another. The counts
      # are not stable across versions: 0.9.0 resolves the graph to
      # MIT 606 / Apache-2.0 151 / ISC 10 / BSD-3-Clause 8, and 0.9.2 to
      # MIT 611 / Apache-2.0 152 / ISC 25 / BSD-3-Clause 10 — verified by
      # rendering this same commit with each. That is not a cache artefact
      # (a cold CARGO_HOME reproduces the warm result exactly); it is the
      # tool. So: bumping this pin REQUIRES re-running `just licenses` with
      # that same version and committing the result, or the gate goes red for
      # a reason that has nothing to do with the dependency graph.
      - name: Install cargo-about
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Install just (NOTICE drift recipe)
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Cargo.lock is committed and current (cargo metadata --locked)
        # A12-2: no compile job could notice a Cargo.toml edit committed
        # without its Cargo.lock update (they resolve a fresh lock on the
        # runner and go green), and cargo-deny below audits whatever graph
        # `cargo metadata` resolves. `--locked` fails when the resolve would
        # have to change the lock, so the graph audited here is the graph
        # committed. The compile lanes above also pass --locked.
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cloud-stack-absent (lance without default features, one arrow/lance)
        # v0.45 N7: Cargo.lock must not carry the cloud object-store stack
        # (opendal, reqsign, aws-sdk, rsa, goosefs-sdk) nor an advisory-affected
        # quick-xml, and arrow/lance must each resolve to one version
        # (invariant #1). Reads the committed lock; compile-free.
        run: scripts/ci/no-cloud-stack.sh
      - name: cargo-deny (advisories)
        run: cargo-deny check advisories
      - name: cargo-deny (licenses + bans + sources)
        run: cargo-deny check licenses bans sources
      - name: NOTICE drift (just licenses-set-check)
        # cargo-deny above gates deny.toml's license ALLOW-list; it never
        # looks at the committed NOTICE. So a dependency bump could land with
        # THIRD-PARTY-LICENSES.md stale — a new crate, a new license, no
        # failure anywhere — because the drift guard for that file had ZERO
        # workflow references, unlike types-check / api-docs-check. That
        # asymmetry is the `gap-licenses` finding (medium) in
        # docs/research/kb-review-coverage-gaps-2026-07.html:206-210.
        #
        # `licenses-set-check`, NOT `licenses-check`, and the difference is
        # load-bearing. `licenses-check` regenerates the file and byte-compares
        # it, which is UNSOUND on a runner: `cargo about generate` embeds each
        # license's full text and a per-license `used_by` list whose ORDER
        # depends on cargo cache state, so the same commit renders differently
        # on a cold runner than on a warm dev box. Measured on this repo: ~90
        # lines differ between a warm render and a cold-CARGO_HOME render of
        # the SAME commit. A byte gate is therefore permanently red off the
        # author's machine. `licenses-set-check` compares the `## Overview`
        # per-license COUNTS, which ARE byte-identical across cache states
        # because they come from the resolved graph — and that is the part
        # carrying the supply-chain signal. `just licenses-check` remains the
        # local byte-level sweep for a deliberate regeneration.
        #
        # Cheap in this job, and the reason it lives here rather than in a
        # compile job: the render is a `cargo metadata` resolve (the crates.io
        # index is already warm from cargo-deny above) plus a handlebars
        # render of about.toml/about.hbs. No compile. The script writes the
        # fresh render to a mktemp file and never touches the committed one.
        # `!cancelled()` for the same reason as api-docs-check: a cargo-deny
        # failure is an independent signal and must not also hide the NOTICE
        # verdict.
        if: ${{ !cancelled() }}
        run: just licenses-set-check

      # WHY THE NEXT TWO STEPS LIVE IN THIS JOB
      # ---------------------------------------
      # Both are assertions over COMMITTED TEXT — the docs' `file.rs:LINE`
      # citations, and the toolchain setup in these workflows. Neither
      # needs a compiler, and this is the only job in ci.yml whose header
      # states outright that no compile happens here, so adding them cannot
      # lengthen a compile lane. They are also UNFILTERED, which is the
      # property that matters most for the first one: the bugs they catch are
      # docs-only and workflow-only diffs, exactly the shape the five
      # path-filtered `code-*` jobs skip, so a gate parked behind that filter
      # would never see the PR that broke it.
      #
      # They run LAST, with `!cancelled()`, for the same reason the NOTICE
      # step does: a cargo-deny failure is an independent signal and must not
      # swallow two more verdicts.
      - name: Doc line-anchor drift (just doc-anchors)
        # O11: nothing in the repo ever checked a `file.rs:LINE` citation, and
        # an adversarial pass found ~30 of docs/configuration.md's
        # `[review.store]` anchors pointing at the wrong line — after an
        # earlier repair round that "fixed" 12 and broke 1, which is the
        # recurrence this gate ends. A hand-repair fixes the instance.
        #
        # Measured on the tree this step shipped with, over docs/*.md: 87
        # anchors, of which 0 DANGLING, 0 PAST-EOF and 45 AMBIGUOUS — 35 of
        # the 45 in configuration.md, 8 in authoring-artifacts.md, 1 each in
        # invariant-test-map.md and kb-code.md. AMBIGUOUS is the class that
        # carries the finding: a bare `config.rs:1414` matches five files in
        # this tree, so it is in range for at least one of them and a pure
        # bounds check can never flag it. The number is unverifiable, which
        # is the defect.
        #
        # `--no-ambiguous` reports those 45 without failing: 45 pre-existing
        # anchors cannot be rewritten in the same commit that adds the gate,
        # and a step that is red from birth is a step everyone learns to skip.
        # Drop the flag once they name one file each and the class goes fatal.
        if: ${{ !cancelled() }}
        run: just doc-anchors

      - name: CI toolchain pins == rust-toolchain.toml (just toolchain-pin-check)
        # O8: the version lives in rust-toolchain.toml ONLY; every job gets it
        # through .github/actions/setup-rust, which reads the file. This step
        # asserts nothing bypasses that action (a direct dtolnay/rust-toolchain
        # use anywhere in .github/ fails) and that the Dockerfile's
        # `rust:X.Y-trixie` builder tag matches the same channel.
        if: ${{ !cancelled() }}
        run: just toolchain-pin-check

      - name: CI cannot pass without running (just ci-selfcheck)
        # v0.44 F1: every workflow defaults to a pipefail shell and scopes its
        # permissions, the five code-* jobs share ONE path filter that cannot
        # SIGPIPE into "skip", witness lanes have floors, checkout pins agree,
        # deny.toml exceptions have not expired -- and the gates' own
        # self-tests (witness, anchors, public-gate, pinned-by) pass.
        if: ${{ !cancelled() }}
        run: just ci-selfcheck

  # REQUIRED-CHECK AGGREGATOR (A12.f3). Branch protection should require THIS
  # job name only: per-job names (some of them path-filtered, some renamed
  # over time) cannot silently drop out of the protection rule if the gate is
  # one stable name that `needs` every other job. `if: always()` makes it run
  # (and report) even when a dependency failed or was cancelled; a job that
  # was legitimately skipped is allowed, anything else is a failure. Add every
  # new job of this file to `needs` — the `jobs-covered` step below fails if
  # one is missing, so the list cannot rot quietly.
  ci-gate:
    permissions:
      contents: read
    name: ci-gate (required check)
    if: always()
    needs:
      - workspace-lint
      - workspace-test
      - drift
      - code-drift
      - e2e
      - embedder-lint
      - embedder-test
      - code-lint
      - code-test
      - code-spa
      - code-e2e
      - web-unit
      - hook-omp
      - supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every job of ci.yml is in needs
        run: |
          declared="$(awk '/^jobs:/{j=1;next} j && /^  [a-z0-9-]+:$/{sub(/:$/,"",$1);print $1}' .github/workflows/ci.yml | grep -vx ci-gate | sort)"
          listed="$(awk '/^  ci-gate:/{g=1} g && /^    needs:/{n=1;next} n && /^      - /{print $2;next} n{exit}' .github/workflows/ci.yml | sort)"
          if [ -z "$declared" ] || [ -z "$listed" ]; then
            echo "could not parse the job list (declared='$declared' listed='$listed')" >&2
            exit 1
          fi
          if [ "$declared" != "$listed" ]; then
            echo "ci-gate.needs != jobs declared in ci.yml" >&2
            diff <(echo "$declared") <(echo "$listed") >&2 || true
            exit 1
          fi
          echo "ci-gate covers $(echo "$declared" | wc -l) jobs"
      - name: no needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items()
                 if v["result"] not in ("success", "skipped")}
          for k, v in sorted(bad.items()):
              print(f"{k}: {v}", file=sys.stderr)
          sys.exit(1 if bad else 0)'
