name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `workflow_dispatch` exists so any branch can be gated on demand —
  # `gh workflow run ci.yml --ref <branch>` — without pushing a throwaway
  # commit or opening a PR purely to make something run. Locally these
  # gates are a 6-40 minute cargo build, so "just push an empty commit"
  # is not a cheap way to test a branch.
  # It lands in the same concurrency group as a push (keyed on
  # github.ref), so a dispatch on a branch cancels an in-flight push run
  # for that branch. A pull_request run is keyed on refs/pull/N/merge and
  # is therefore in a DIFFERENT group — deliberately, so dispatching on a
  # branch can never cancel that branch's open PR checks.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental compilation is worthless on an ephemeral runner (nothing to
  # be incremental against) and its blobs are pure bloat in the target dir
  # the Actions cache then has to tar, upload and store against the 10 GB
  # per-repo cap. Off for every job in this file.
  CARGO_INCREMENTAL: "0"
  # PF-B1 — `debug = "line-tables-only"` moved into Cargo.toml's
  # [profile.dev] (one source of truth; the 224 GB local target/debug was
  # the same disease as the runner-disk overflow that SIGBUS'd the linker
  # here). No CARGO_PROFILE_DEV_DEBUG override — an env value would
  # silently win over any future Cargo.toml change.

# Least privilege: nothing by default; every job below declares its own grants
# (v0.44 F1, review A12.f7).
permissions: {}

# RUNNERS — all jobs run on GitHub-hosted runners. Every job below is an
# `ubuntu-latest` (4 vCPU / 16 GB / ~14 GB free disk; free and unlimited on a
# public repo), and so is every job in every other workflow here — the image
# build and the nightly bench included. The job budgets and the disk-space
# guard below are all sized for that machine.
#
# CACHING — GitHub caps a repository at 10 GB of Actions cache and evicts
# LRU, while a single lance/datafusion target dir is multi-GB. So the
# Swatinem/rust-cache `shared-key` is per JOB FAMILY, not per job, and each
# family has exactly ONE writer — the heaviest lane in it:
#
#     family         written by       restored read-only by
#     workspace      workspace-test   workspace-lint
#     drift          drift            —
#     code-drift     code-drift       —   (V76-R4a; kb-code ts-export)
#     code           code-test        code-lint
#     e2e-fast       e2e              —
#     code-e2e-fast  code-e2e         —
#     embedder       embedder-test    embedder-lint
#
# ONE WRITER PER FAMILY is not cosmetic. rust-cache skips its save whenever
# the restore was an exact hit, so the FIRST job to save after a key change
# (a Cargo.lock or a rustc bump) freezes that family's content until the next
# key change. If a `cargo clippy` lane won that race it would pin a
# check-shaped target dir (rmeta, no codegen) into the family, and its test
# lane would then rebuild from scratch on every run — so the lint lanes are
# `save-if: 'false'` (restore-only) and the test lane owns the write.
#
# A family is also never SHARED between a path-filtered writer and an
# unfiltered reader. A filtered job skips its cache step entirely, so after a
# rustc bump an unfiltered restore-only sibling could run cold forever,
# waiting for a write that never comes. The five kb-code filters below DO
# match `rust-toolchain.toml` (they must: it decides the rustc those jobs
# compile with, and rustup's directory override outranks `rustup default`),
# so a bump moves the filtered and unfiltered lanes together and that
# deadlock cannot open — this paragraph used to claim the filter deliberately
# did NOT match it, which was a stale note from before the filter grew the
# entry, and it is corrected here rather than left to mislead the next reader
# of a cache-cold incident. `code` and `code-e2e-fast` are written by filtered
# jobs, but every member of those two families is behind the SAME filter:
# stale together, on runs where nothing in them executes anyway, and the next
# kb-code change runs cold once and re-writes them. That is why kb-code did
# not simply move into `workspace`/`e2e-fast` as their writer.
#
# WHY `drift`, `code` AND `code-e2e-fast` ARE THEIR OWN FAMILIES — measured,
# cold run 34011072239 vs. warm run 34026314657 (2026-09-06). A family's
# cache only ever helps the job that wrote it: with workspace+drift+code all
# keyed `workspace`, the `workspace` job (the shortest of the three) always
# won the save race, and the other two stayed effectively cold — cold -> warm
# they moved 34.9 -> 30.8 min (drift) and 31.1 -> 27.5 (code), against
# 23.4 -> 11.4 for the job that owned the entry (e2e 24.7 -> 11.7, embedder
# 22.2 -> 5.8). The drift job's warm log shows the whole
# arrow/datafusion/lance graph recompiling right after a "full match: true"
# 1032 MB restore, because `--features ts-export` pulls in ts-rs
# (chrono-impl), which changes chrono's resolved features and cascades
# through everything. Same shape for kb-code: its gix/tree-sitter/grep/nucleo
# graph is never in what `workspace` saves, and code-e2e's fast-profile
# kb-code-server graph is never in what `e2e` saves.
#
# COST against the 10 GB cap: the three existing families measure 1.03 GB
# (workspace) + 1.06 (embedder) + 0.69 (e2e-fast); the three new ones should
# land near ~1.8 (drift — it holds TWO ts-export flavors, since the kb-core
# and the kb-server pass resolve features differently), ~1.6 (code) and ~1.1
# (code-e2e-fast), plus ~0.4 of Playwright browsers and bench-nightly.yml's
# own family. That is ~8 GB of 10 with the estimates deliberately generous.
# If it ever does tip over, GitHub evicts LRU — and the least recently used
# entry is by construction the nightly bench's (touched once a day, versus
# every PR for these), so the overflow lands on a non-blocking nightly rather
# than on the PR path. Every family also saves ONLY on main (`save-if`): a
# cache written on a PR branch is scoped to that branch, restorable by nobody
# else, and still counts against the cap — PRs restore main's entry instead.
# `shell: bash` is GitHub's `bash --noprofile --norc -eo pipefail {0}`; the
# implicit default (`bash -e {0}`) has NO pipefail, so `cmd | tee log` reports
# tee's exit status and a failing `cmd` goes green (the e2e vacuous pass,
# d4f3063d). Setting it once here covers every `run:` step in this file.
defaults:
  run:
    shell: bash

jobs:
  workspace-lint:
    permissions:
      contents: read
    name: workspace-lint (fmt + clippy)
    runs-on: ubuntu-latest
    # SPLIT out of the old `workspace` job (2026-09-06), which ran fmt +
    # clippy + the test sweep serially for 23.4 min cold. clippy is
    # `cargo check`-shaped (dependencies get metadata only, no codegen), so
    # it cost just 3.3 of those minutes — but it cost them IN FRONT of the
    # sweep. As its own job the lint verdict lands in ~6 min and the test
    # lane's wall drops by the same 3.3. Between them the two jobs still run
    # exactly what `just ci-workspace` runs locally — keep them in lock-step
    # with that recipe.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (drop preinstalled SDKs)
        # A hosted runner starts with only ~14 GB free on /, and the
        # lance/datafusion dependency graph plus its test-binary links can
        # eat that (a full disk shows up as a SIGBUS'd linker, not as
        # ENOSPC). Reclaim ~20 GB of preinstalled toolchains nothing here
        # uses. Inline on purpose — no third-party action to pin/trust.
        # Best-effort: missing dirs are ignored.
        #
        # The removals run CONCURRENTLY (2026-09-06): this step measured
        # 0.4-2.8 min across the jobs of run 34011072239 — pure metadata
        # churn on the runner's disk, the Android SDK tree alone being
        # ~9 GB — and it sits in front of every compile, on every job's
        # critical path. Each rm is its own subshell so a missing dir can
        # never make `wait` fail the step under `bash -e`.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        # Reads the version from rust-toolchain.toml (single source; see
        # .github/actions/setup-rust/action.yml) — no per-job literal to drift.
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: workspace
          # RESTORE-ONLY: the `workspace` family is written by its test lane
          # alone (see the CACHING note at the top). A clippy run leaves
          # check-shaped artifacts (rmeta, no codegen) behind, and if it
          # won the save race the test lane would rebuild from scratch
          # on every run.
          save-if: 'false'

      - name: Install protoc (lancedb transitive dep)
        # BOTH packages: libprotobuf-dev ships the well-known-type includes
        # (google/protobuf/empty.proto, …) that lance-encoding's build
        # imports, while protobuf-compiler provides only the binary —
        # alone it fails with "google/protobuf/empty.proto: File not found".
        # Hosted runners preinstall neither. Same pair release.yml and the
        # prod Dockerfile install.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `--exclude kb-embedder` keeps the `local-embedder` feature (and ONNX
      # Runtime) OUT of the shared kb-core rlib, so this job builds/tests/clippy
      # link ZERO onnxruntime — the real shipping shape for kb/kb-server
      # (invariant §23). No system onnxruntime is installed here. The ORT
      # surface is covered by the `embedder-*` jobs below. `--exclude
      # kb-code-server --exclude kb-code-cli` is a SEPARATE, unrelated
      # exclusion (kb-code Wave 1, W1.1): that sibling daemon has its own
      # dependency surface (gix, tree-sitter, grep-*, nucleo) and no ORT
      # involvement — the exclusion is pure build-time isolation (keep this
      # sweep's compile surface stable), covered by the `code-*` jobs below.
      # `--exclude kb-lip` (design-lip.md Track L1) joins the SAME carve-out:
      # a kb-code-adjacent sibling crate (an opt-in LSP intelligence
      # provider, talked to over lip/1 HTTP — never linked by kb-code-server)
      # whose own clippy/test now live in `ci-code`/the `code-*` jobs below, so
      # excluding it here is pure isolation, not a dependency concern, and
      # avoids running its (tiny) test suite twice.
      # Mirrors the justfile's `ci-workspace` + `ci-embedder`/`ci-code` split.
      - name: cargo clippy
        run: cargo clippy --locked --workspace --exclude kb-embedder --exclude kb-code-server --exclude kb-code-cli --exclude kb-lip --all-targets -- -D warnings

      - name: Invariant-test coverage (GC-C2, non-blocking)
        # Prints the invariant:N → pinning-test coverage table (see
        # docs/invariant-test-map.md). The script always exits 0 — this is a
        # visibility signal for reviewers/agents, not a merge gate. No
        # untrusted/event input involved: it only greps the checked-out tree.
        run: scripts/check-invariants.sh

  workspace-test:
    permissions:
      contents: read
    name: workspace-test (nextest + doctests + API route table)
    runs-on: ubuntu-latest
    # 120 dated from the SERIAL (--test-threads=1) era (outgrew 90 on
    # 2026-07-10's pushes). Post-flip (PF-C1, nextest process-per-test + the
    # drift-job split) it ran ~20 min warm, and the 2026-09-06 lint/test
    # split took clippy's 3.3 min off the front: 19.5 cold, 11.4 warm. 90
    # keeps a >4x margin over the cold case — and the number that really
    # needs the headroom is not the sweep but the POST-JOB cache save this
    # job owns, which must never be cut off mid-`tar` (see the `code-test`
    # job's own 60m lesson, kept below).
    timeout-minutes: 90
    env:
      # Widen the "seed a corpus, then poll until the watcher/indexer/census
      # catches up" test deadlines beyond their local-dev defaults (30s/30s)
      # — a 4-vCPU hosted runner is far slower and more contended than a dev
      # box, and a tight deadline there is a false-red timing race, not a
      # real failure. See docs/architecture-invariants.md's
      # KB_TEST_INDEX_TIMEOUT_SECS pitfalls entry; test logic is untouched.
      KB_TEST_INDEX_TIMEOUT_SECS: "120"
      KB_TEST_HTTP_TIMEOUT_SECS: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (drop preinstalled SDKs)
        # Same reclaim as the `workspace-lint` job — see its comment.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        # Reads the version from rust-toolchain.toml (single source; see
        # .github/actions/setup-rust/action.yml) — no per-job literal to drift.
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: workspace
          # Only main writes the cache — see the CACHING note at the top.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep)
        # BOTH packages: libprotobuf-dev ships the well-known-type includes
        # (google/protobuf/empty.proto, …) that lance-encoding's build
        # imports, while protobuf-compiler provides only the binary —
        # alone it fails with "google/protobuf/empty.proto: File not found".
        # Hosted runners preinstall neither. Same pair release.yml and the
        # prod Dockerfile install.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run --profile ci
        # PF-C1 flip (2026-09-04): replaces the serial `cargo test --
        # --test-threads=1` sweep. That serial run existed because the
        # parallel IN-PROCESS harness used to hang on the runner of the day
        # (CPU-quota throttling and/or overlayfs vs. the poll watcher —
        # never fully isolated); nextest's process-per-test isolation was
        # the fix, adopted only after 3 consecutive green runs on main. It
        # is kept on hosted runners for the same reason it was adopted:
        # per-test isolation makes a hung test one failure, not a job wall.
        # Profile: .config/nextest.toml [profile.ci] (lance-heavy overrides
        # live there).
        run: cargo nextest run --locked --profile ci --workspace --exclude kb-embedder --exclude kb-code-server --exclude kb-code-cli --exclude kb-lip

      - name: nextest overrides each match at least one test
        # v0.44 F1 (I3): PF-C1 renamed the binaries and the `lance-heavy`
        # override's filter matched NOTHING for a while -- silently, because a
        # filter that matches nothing is not an error. Asks nextest itself.
        run: python3 scripts/ci/nextest-overrides-check.py -- --profile ci --workspace --exclude kb-embedder --exclude kb-code-server --exclude kb-code-cli --exclude kb-lip

      - name: Witness (nextest junit -> floor + zero failures)
        # v0.44 F1 -- decide the lane from nextest's own junit report
        # (.config/nextest.toml [profile.ci.junit]), not from its exit code.
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/witness.py nextest-junit target/nextest/ci/junit.xml --lane nextest

      - name: cargo test --doc
        # nextest does not run doctests; the serial sweep it replaced did.
        # This keeps the flipped required job a coverage SUPERSET of the
        # old one (near-free when few doctests exist).
        run: cargo test --locked --doc --workspace --exclude kb-embedder --exclude kb-code-server --exclude kb-code-cli --exclude kb-lip

      - name: Install just (drift-check recipe)
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: API route-table drift (just api-docs-check)
        # MOVED here from the `drift` job (2026-09-06). `just api-docs-check`
        # regenerates docs/api-routes.md from crates/kb-server/src/router.rs
        # by running ONE #[ignore]d integration test, then fails if the
        # committed table moved. Over in `drift` that test had to be linked
        # in a THIRD feature flavor, after the two ts-export passes, and cost
        # ~2 min of that job's critical path both cold and warm. Here the
        # nextest sweep above has already built the very same `api_docs` test
        # binary in the very same profile, so it costs seconds.
        # `!cancelled()` rather than the implicit `success()`: a red test
        # suite should not also hide the route-table verdict.
        if: ${{ !cancelled() }}
        run: just api-docs-check

  drift:
    permissions:
      contents: read
    name: drift (TS wire bindings)
    # PF-C1 — split out of `workspace`: `just types` recompiles kb-core +
    # kb-server under a SECOND feature flavor (--features ts-export), which
    # sat on the required job's 120-min critical path. Deliberately NOT
    # unified into the workspace flavor: the shipping shape is no-ts-export,
    # and CI must keep compiling both. Regenerates web/src/api/generated/
    # (ts-rs) from the Rust source and fails if it drifted from the committed
    # output — a wire-type derive landed without `just types` is caught here,
    # not in review. Mirrors the local `just ci` gate; the OTHER half of that
    # gate, `just api-docs-check`, moved to `workspace-test` (2026-09-06),
    # where the test binary it needs has already been built.
    #
    # OWN cache family since 2026-09-06 (it used to share `workspace`):
    # measured, sharing bought it almost nothing — 34.9 min cold vs 30.8
    # warm, while the job that actually wrote that family went 23.4 -> 11.4.
    # The warm log says why: right after a "full match: true" 1032 MB restore
    # the entire arrow/datafusion/lance graph recompiles, because ts-export
    # pulls in ts-rs (chrono-impl), chrono's resolved features change, and
    # the cascade reaches everything. See the CACHING note at the top.
    runs-on: ubuntu-latest
    # Cold ~33 min: two full compiles (the kb-core pass and the kb-server
    # pass resolve features differently, so neither reuses the other's
    # dependency artifacts) on 4 vCPU. Warm should fall to ~12 now that this
    # family has an entry of its own; 90 keeps room for the cold case.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (drop preinstalled SDKs)
        # Same reclaim as the `workspace-lint` job — see its comment.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        # Reads the version from rust-toolchain.toml (single source; see
        # .github/actions/setup-rust/action.yml) — no per-job literal to drift.
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: drift
          # Only main writes the cache — see the CACHING note at the top.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep)
        # BOTH packages: libprotobuf-dev ships the well-known-type includes
        # (google/protobuf/empty.proto, …) that lance-encoding's build
        # imports, while protobuf-compiler provides only the binary —
        # alone it fails with "google/protobuf/empty.proto: File not found".
        # Hosted runners preinstall neither. Same pair release.yml and the
        # prod Dockerfile install.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install just (drift-check recipes)
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Generated-artifact drift
        run: just types-check

  code-drift:
    permissions:
      contents: read
    name: code-drift (kb-code TS wire bindings)
    # V76-R4a — own job, never a step on `drift` (the kb SPA generator).
    # `--features ts-export` on kb-code-server is a third flavor on top of
    # the two kb-core/kb-server ts-export passes; sharing `drift` or `code`
    # would recompile the tree-sitter/gix graph the way sharing `workspace`
    # made the kb drift job stay cold. Path-filtered like the other
    # `code-*` jobs so a kb-only PR does not pay this compile.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for kb-code-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/code-changed.sh

      - name: Free disk space (drop preinstalled SDKs)
        if: steps.changes.outputs.run == 'true'
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: code-drift
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep)
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install just (drift-check recipes)
        if: steps.changes.outputs.run == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Generated kb-code wire-type drift
        if: steps.changes.outputs.run == 'true'
        run: just gen-ts-code-check

      - name: Skipped (no kb-code-relevant changes)
        if: steps.changes.outputs.run != 'true'
        run: scripts/ci/code-changed.sh --skip-message

  e2e:
    permissions:
      contents: read
      # actions: read -> `gh run download` of the previous main run's witness
      # report (flaky-twice detection, scripts/ci/witness.py --prev).
      actions: read
    name: e2e (Playwright iframe smoke)
    # No `needs:` — hosted runners have no slot contention, so every job in
    # this file starts at T0 and a red `workspace-test` never delays this
    # feedback. The suite is a functional smoke (keyword search +
    # SPA/iframe), not a perf test, so it links `--profile fast` rather than
    # thin-LTO release.
    runs-on: ubuntu-latest
    # 90 -> 120: cold, 4 vCPU now covers a fast-profile kb-server + kb-cli
    # build, the SPA bundle, and two browser downloads before a spec runs.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags, because this job's binaries carry a VERSION
          # STAMP and the default shallow fetch silently corrupts it.
          # `crates/kb-buildstamp/build.rs` (PF-B1; kb-cli links it) runs
          # `git describe --tags --match 'v[0-9]*' --always --dirty` to fill
          # `kb --version`; the e2e daemon (the kb-server BIN) now reports
          # the `0.0.0-dev` fallback instead. Under checkout's default
          # `--no-tags --depth=1` no tag is reachable from HEAD, `--always`
          # falls back to a bare abbreviated sha, and every daemon this suite
          # boots reports e.g. `be3b941` as its version — which the SPA
          # renders as `vbe3b941`. That is what broke
          # settings-dashboard.spec.ts: its badge assertion was passing or
          # failing on whether HEAD's first hex character happened to be a
          # digit. `code-*`/`code-e2e` already fetch full history (for their
          # diff), which is why the stamp is correct there and only here.
          fetch-depth: 0
          fetch-tags: true

      - name: Free disk space (drop preinstalled SDKs)
        # As `workspace-lint`, plus: this suite builds fast-profile binaries +
        # Chromium and spawns several kb-server daemons that each write a
        # fresh lance/sqlite state tree, so disk/IO pressure here also shows
        # up as a daemon missing its cold-boot spawn wait.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: e2e-fast
          # Only main writes the cache — see the CACHING note at the top.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      # kb-server links no ONNX Runtime (invariant §23); the e2e suite drives
      # the SPA/iframe + keyword search and does not exercise the embedder
      # subprocess, so no onnxruntime install is needed.
      - name: Build kb-server + kb-cli (fast profile — e2e is a functional smoke)
        # spa-lists-import-cli.spec.ts shells out to the fast-profile `kb`
        # binary (target/fast/kb) for the reading-list import/export
        # round-trip, so the CLI must be built too — mirrors the justfile
        # `ci-e2e` recipe. Shipping stays `--release`
        # (build-image.yml / release.yml).
        run: cargo build --locked --profile fast -p kb-server -p kb-cli

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build SPA bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Annotator bundle-size guard (≤ 12 KiB)
        # Raised 10 → 12 KiB when the pull-based selection query
        # (`cm:selection-query`/`cm:selection-pull`) and the Gecko-safe relay
        # landed: a protocol the mobile comment path depends on outgrew the
        # old cap, and starving it would have been the wrong trade. 12 KiB is
        # still an order of magnitude under the SPA bundle — this guard exists
        # to catch a stray `import` pulling a dependency graph into the
        # in-iframe script, not to ration the protocol itself. (Comments cost
        # nothing here: esbuild strips them.)
        working-directory: web
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s dist/annotate.js)
          echo "dist/annotate.js = ${SIZE} bytes"
          if [ "$SIZE" -gt 12288 ]; then
            echo "::error::annotator bundle exceeded 12 KiB budget" >&2
            exit 1
          fi

      - name: Annotator bundle declares no globals (classic-script guard)
        # A11.f2: the daemon injects annotate.js as a CLASSIC <script defer>
        # into the artifact's own document, so any top-level function/var/
        # const it declares lands in the page's global scope and can collide
        # with the artifact's own names — the vite 8 mangler did exactly that
        # (9d9f6234) and the whole script died with a SyntaxError. The e2e
        # spec annotator-bundle-isolation.spec.ts proves the behaviour; this
        # is the cheap structural pre-check that fails in seconds: the bundle
        # must be a single IIFE statement, with no import/export statements
        # (scripts/ci/check-annotate-bundle.cjs PARSES it and walks every
        # top-level statement -- the earlier regex looked only at the start, so
        # `(function(){})();var x=1;` passed -- and self-tests that case).
        working-directory: web
        run: |
          node ../scripts/ci/check-annotate-bundle.cjs --self-test
          node ../scripts/ci/check-annotate-bundle.cjs dist/annotate.js

      - name: Install Playwright deps
        working-directory: tests/e2e
        run: npm ci

      - name: Resolve Playwright version (browser-cache key)
        id: playwright-version
        working-directory: tests/e2e
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium + Firefox
        # --with-deps is load-bearing: a hosted runner does not ship the
        # browsers' system libraries, and without it they install fine and
        # then die at launch with `error while loading shared libraries:
        # libglib-2.0.so.0` — which reads as dozens of failing specs (every
        # one that touches `page`) while the API-only specs keep passing and
        # the summary still says "13 passed". Playwright prints the fix in
        # the log ("Host system is missing dependencies to run browsers").
        # The justfile's own ci-e2e recipe passes --with-deps too.
        #
        # Firefox joins the set for the `firefox` project in
        # playwright.config.ts — a Gecko-only slice (grepped to `@selection`)
        # that covers the selection→comment relay. Gecko's selection-event
        # timing differs from Blink's in ways no amount of Chromium testing
        # can catch, and that divergence is exactly what broke authoring a
        # comment from a text selection on Firefox for Android.
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        # V72-C3 — capture to a file (in addition to the live `list` output)
        # so the next step can grep it.
        #
        # `set -o pipefail` is REQUIRED for `... | tee`: in a shell without
        # it a pipeline's status is the LAST command's, so a failing
        # `playwright test` exited the step green (d4f3063d). The workflow now
        # sets `defaults.run.shell: bash` (= `bash -eo pipefail`), which
        # covers every step; the explicit `set -o pipefail` below is kept as a
        # belt-and-braces line so this step stays correct if that default is
        # ever removed.
        #
        # v0.44 F1 -- KB_WITNESS_DIR makes playwright.config.ts ALSO write its
        # JSON report; the `Witness` step below decides the lane from THAT
        # (unexpected == 0 and executed >= ci/test-floors.toml), so this
        # step's exit status is no longer the only evidence.
        env:
          KB_WITNESS_DIR: ${{ runner.temp }}/witness
        working-directory: tests/e2e
        run: |
          mkdir -p "$KB_WITNESS_DIR"
          set -o pipefail; npx playwright test 2>&1 | tee playwright-output.log

      - name: Previous main e2e report (flaky-twice check input)
        # A12.f5 -- the same spec flaky on main twice in a row is a defect,
        # not hosted-runner load (which loses a DIFFERENT spec each run).
        # Only on a push to main: PRs are not failed for a flake main already
        # carried. Absence of a previous report (first run after this landed,
        # expired artifact) is tolerated and printed, never silent.
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id="$(gh run list --branch main --workflow ci.yml --status success --event push -L 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$id" ] && gh run download "$id" -n witness-e2e -D "$RUNNER_TEMP/prev"; then
            echo "previous main report: run $id"
          else
            echo "no previous main e2e witness report available (run '$id'); flaky-twice check skipped"
          fi

      - name: Witness (Playwright JSON report -> floor + zero failures)
        # Decides the lane from the REPORT: unexpected == 0 and executed >=
        # the `e2e` floor in ci/test-floors.toml. `!cancelled()` so it also
        # reports the count when the run step above already failed.
        if: ${{ !cancelled() }}
        env:
          KB_WITNESS_DIR: ${{ runner.temp }}/witness
        run: |
          prev=()
          if [ "${{ github.event_name }}" = push ] && [ -f "$RUNNER_TEMP/prev/pw-e2e.json" ]; then
            prev=(--prev "$RUNNER_TEMP/prev/pw-e2e.json" --fail-repeat-flaky)
          fi
          python3 scripts/ci/witness.py playwright "$KB_WITNESS_DIR/pw-e2e.json" --lane e2e "${prev[@]}"

      - name: Upload witness report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-e2e
          path: ${{ runner.temp }}/witness
          retention-days: 14
          if-no-files-found: warn

      - name: Flaky spec summary
        # V72-C3 — the CI-only retry (playwright.config.ts: `retries: 1`,
        # `process.env.CI` gated) must stay VISIBLE, never a silent green.
        # Playwright's `list` reporter buckets a retried-then-passed spec
        # under its own "N flaky" summary line, formatted exactly like the
        # "N failed" block above it. Grep that bucket out of the captured run
        # (a static local file — no untrusted event data touches this shell)
        # and surface it in the job summary so a flaky-but-green run is still
        # an observable signal instead of something dug out of a raw log —
        # and so the SAME spec recurring across runs is easy to notice (the
        # hosted-runner-load pattern this budget/retry pair is meant for
        # loses a DIFFERENT spec each run; a repeat name is a real bug, not
        # load — see the PR body).
        if: always()
        working-directory: tests/e2e
        run: |
          if [ -f playwright-output.log ] && grep -qE '^[[:space:]]*[0-9]+ flaky[[:space:]]*$' playwright-output.log; then
            {
              echo "## Flaky this run"
              echo
              echo "Passed only after a retry (retries: 1, CI-only) — not a merge blocker, but track it if the same spec shows up here twice:"
              echo
              awk '
                /^[[:space:]]*[0-9]+ flaky[[:space:]]*$/ { grab=1; next }
                grab && /^[[:space:]]+\[/ { print; next }
                { grab=0 }
              ' playwright-output.log | sed 's/^[[:space:]]*/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  embedder-lint:
    permissions:
      contents: read
    name: embedder-lint (ORT surface — clippy)
    runs-on: ubuntu-latest
    # SPLIT out of the old `embedder` job (2026-09-06): clippy over the two
    # ORT-linking crates is check-shaped and took 4.4 of that job's 22.2
    # cold minutes, sitting in front of a 17.5-minute test leg. As its own
    # job the ORT lint verdict lands in ~6 min. Between them the two jobs
    # still run exactly what `just ci-embedder` runs locally.
    timeout-minutes: 30
    # No `needs:` — hosted runners are parallel and free; serializing only
    # delays the answer.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (drop preinstalled SDKs)
        # Same reclaim as the `workspace-lint` job — see its comment.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: embedder
          # RESTORE-ONLY: the `embedder` family is written by its test lane
          # alone (see the CACHING note at the top). A clippy run leaves
          # check-shaped artifacts (rmeta, no codegen) behind, and if it
          # won the save race the test lane would rebuild from scratch
          # on every run.
          save-if: 'false'

      - name: Install protoc (lancedb transitive dep)
        # BOTH packages: libprotobuf-dev ships the well-known-type includes
        # (google/protobuf/empty.proto, …) that lance-encoding's build
        # imports, while protobuf-compiler provides only the binary —
        # alone it fails with "google/protobuf/empty.proto: File not found".
        # Hosted runners preinstall neither. Same pair release.yml and the
        # prod Dockerfile install.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      # ONNX Runtime is fetched from a CDN at build time by `ort-sys`
      # (fastembed's `ort-download-binaries`) and statically linked — no system
      # onnxruntime install needed, and this proves the SAME static-ORT path the
      # Docker image ships. (Air-gapped runners: set ORT_LIB_PATH=<dir>.) This is the slow path; the `workspace-*` jobs stay
      # ORT-free and fast.
      - name: cargo clippy (embedder + kb-core/local-embedder)
        run: |
          cargo clippy --locked -p kb-embedder --all-targets -- -D warnings
          cargo clippy --locked -p kb-core --features local-embedder --all-targets -- -D warnings

  embedder-test:
    permissions:
      contents: read
    name: embedder-test (ORT surface — tests)
    runs-on: ubuntu-latest
    # This leg compiles kb-core TWICE (plain, then with `local-embedder`)
    # and links a statically-bundled ONNX Runtime, on 4 vCPU: 17.5 min cold
    # once clippy moved out to `embedder-lint`, 5.8 warm (this job owns the
    # `embedder` cache family, so the warm number is the real one).
    timeout-minutes: 90
    # No `needs: workspace-test` — that gate existed only to ration a scarce
    # runner slot for the slow ORT build. Hosted runners are parallel and
    # free; serializing only delays the answer.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (drop preinstalled SDKs)
        # Same reclaim as the `workspace-lint` job — see its comment.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        # Reads the version from rust-toolchain.toml (single source; see
        # .github/actions/setup-rust/action.yml) — no per-job literal to drift.
        uses: ./.github/actions/setup-rust

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: embedder
          # Only main writes the cache — see the CACHING note at the top.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (lancedb transitive dep)
        # BOTH packages: libprotobuf-dev ships the well-known-type includes
        # (google/protobuf/empty.proto, …) that lance-encoding's build
        # imports, while protobuf-compiler provides only the binary —
        # alone it fails with "google/protobuf/empty.proto: File not found".
        # Hosted runners preinstall neither. Same pair release.yml and the
        # prod Dockerfile install.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      # ONNX Runtime is fetched from a CDN at build time by `ort-sys`
      # (fastembed's `ort-download-binaries`) and statically linked — no system
      # onnxruntime install needed, and this proves the SAME static-ORT path the
      # Docker image ships. (Air-gapped runners: set ORT_LIB_PATH=<dir>.) This is the slow path; the `workspace-*` jobs stay
      # ORT-free and fast.
      - name: cargo test (embedder + kb-core/local-embedder)
        run: |
          cargo test --locked -p kb-embedder --no-fail-fast
          cargo test --locked -p kb-core --features local-embedder --no-fail-fast

  code-lint:
    permissions:
      contents: read
    name: code-lint (kb-code + kb-lip clippy)
    # kb-code is a separate sibling daemon+SPA pair inside this workspace
    # (design v4, "The read-first IDE" — research kb corpus); kb-lip
    # (design-lip.md, Track L1) is its own standalone opt-in LSP
    # intelligence adapter, linted/tested in the SAME lane because it's
    # kb-code-adjacent (talked to over lip/1 HTTP by kb-code-server, L2 —
    # never linked).
    # Paths-filtered: only actually builds when kb-code's own crates, kb-lip,
    # its SPA, or something that could affect any crate's resolution/build
    # shape (root Cargo.toml, Cargo.lock, the justfile), changed. The filter
    # is `scripts/ci/code-changed.sh` (no third-party paths-filter action to
    # pin/trust — same reasoning as dco.yml; v0.44 F1 moved it out of five
    # pasted inline copies whose skip messages had already drifted, and made
    # it SIGPIPE-proof — see the script header) and gates each step via `if:`, not a
    # job-level `if:`, so the job itself always reports success/failure (safe
    # to mark as a required check; a job-level skip can leave a required
    # check permanently pending). All FIVE `code-*` jobs (code-drift,
    # code-lint, code-test, code-spa, code-e2e) call the SAME script
    # (`just ci-selfcheck` asserts it). Each entry is there because a job below actually reads that
    # path, not because the crate sounds related:
    #   crates/kb-core/, crates/kb-server/ — kb-code-server path-depends on
    #     both, so a change to either can break the only jobs that compile
    #     or test kb-code.
    #   plugins/kb-code/ — code-test/code-lint EXECUTE
    #     plugins/kb-code/hooks/kb-code-annotations.sh (and the codex twin)
    #     as real subprocesses; see annotations_hook.rs's hook_script_path.
    #   web/ — web-code/src/lib/iconParity.test.ts readFileSync's
    #     web/src/components/icons.tsx and asserts the shared glyph SVG
    #     bodies are byte-identical, so a web/-only PR would otherwise skip
    #     the only job that catches icon divergence.
    #   scripts/review-store/ — code-test executes
    #     scripts/review-store/review_snapshot.py and asserts it against
    #     scripts/review-store/fixtures/golden-review-snapshot.json
    #     (tests/review/rs_u0_golden.rs), so a fixture-only edit skipped
    #     the very test that exists to catch it.
    #   rust-toolchain.toml — it decides which rustc the skipped jobs would
    #     have compiled with (rustup's directory override outranks
    #     `rustup default`), so a bump changes the toolchain
    #     every job installs (via `.github/actions/setup-rust`, which reads it);
    #     `toolchain-pin-check` (supply-chain) asserts nothing bypasses that.
    #   .github/workflows/ci.yml — the file that DEFINES this filter. If a
    #     PR's only diff is this file, it used to be able to neuter every
    #     code-* job (drop `-D warnings`, repoint a `run:`) and still have
    #     all five report success: the gate and its own off-switch were the
    #     same unprotected file.
    runs-on: ubuntu-latest
    # SPLIT out of the old `code` job (2026-09-06), which ran clippy, the
    # test sweep and the SPA build serially for 31.1 min cold. clippy is
    # check-shaped and took 4.8 of them, in front of a 25-minute test leg.
    # `cargo clippy` here mirrors `just ci-code`'s first line — keep the two
    # in lock-step (the sibling `code-test` job runs its second).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the BASE_SHA..HEAD_SHA diff below is reachable
          # (actions/checkout's default shallow fetch only guarantees HEAD).
          fetch-depth: 0

      - name: Check for kb-code-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/code-changed.sh

      - name: Free disk space (drop preinstalled SDKs)
        if: steps.changes.outputs.run == 'true'
        # Same reclaim as the `workspace-lint` job — see its comment.
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                   /usr/local/share/boost; do
            ( sudo rm -rf "$d" || true ) &
          done
          wait
          df -h /

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Cache cargo + target
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: code
          # RESTORE-ONLY: the `code` family is written by its test lane
          # alone (see the CACHING note at the top). A clippy run leaves
          # check-shaped artifacts (rmeta, no codegen) behind, and if it
          # won the save race the test lane would rebuild from scratch
          # on every run.
          save-if: 'false'

      - name: Install protoc (lancedb transitive dep via kb-core)
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: cargo clippy (kb-code + kb-lip)
        if: steps.changes.outputs.run == 'true'
        run: cargo clippy --locked -p kb-code-server -p kb-code-cli -p kb-lip --all-targets -- -D warnings

      - name: Skipped (no kb-code-relevant changes)
        if: steps.changes.outputs.run != 'true'
        run: scripts/ci/code-changed.sh --skip-message

