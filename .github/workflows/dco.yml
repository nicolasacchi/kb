# Enforces the Developer Certificate of Origin sign-off (see CLA.md /
# CONTRIBUTING.md): every commit in a PR must carry a `Signed-off-by:`
# trailer. Implemented as an inline git check rather than a third-party
# action — the one action it uses (checkout) is SHA-pinned like every other
# workflow's, and the only inputs are the
# PR's base/head commit SHAs (passed via env, never interpolated into the
# shell), so there is no injection surface.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: nothing by default; every job below declares its own grants
# (v0.44 F1, review A12.f7).
permissions: {}

# `shell: bash` is GitHub's `bash --noprofile --norc -eo pipefail {0}`; the
# implicit default (`bash -e {0}`) has NO pipefail, so `cmd | tee log` reports
# tee's exit status and a failing `cmd` goes green (the e2e vacuous pass,
# d4f3063d). Setting it once here covers every `run:` step in this file.
defaults:
  run:
    shell: bash

jobs:
  dco-check:
    permissions:
      contents: read
    name: Check DCO sign-off
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-h4o","h4oamd"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so every commit in the PR range is reachable.
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/dco-check.sh

  # Regression test for the vacuous-pass class (A12.f4). Every earlier fix to
  # the check above was verified by a hand-measured shell snippet; this job
  # makes those measurements permanent: it builds a scratch repo and asserts
  # that scripts/dco-check.sh REJECTS an unresolvable range, an empty range, a
  # missing sign-off and a sign-off naming someone else, and ACCEPTS a
  # matching one. If the script ever starts passing having checked nothing,
  # this job goes red on the PR that did it.
  dco-selftest:
    permissions:
      contents: read
    name: DCO check self-test
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-h4o","h4oamd"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run scripts/dco-check.sh against scratch repos
        run: |
          set -euo pipefail
          check="$PWD/scripts/dco-check.sh"
          work="$(mktemp -d)"
          cd "$work"
          git init -q .
          git config user.name "Test Author"
          git config user.email "author@example.invalid"
          git commit -q --allow-empty -m "base"
          base="$(git rev-parse HEAD)"

          expect() {  # expect <pass|fail> <label> <base> <head>
            local want="$1" label="$2" b="$3" h="$4" rc=0
            BASE_SHA="$b" HEAD_SHA="$h" "$check" >/tmp/dco-out 2>&1 || rc=$?
            if [ "$want" = pass ] && [ "$rc" -ne 0 ]; then
              echo "SELFTEST FAIL: '$label' should pass, exited $rc"; cat /tmp/dco-out; exit 1
            fi
            if [ "$want" = fail ] && [ "$rc" -eq 0 ]; then
              echo "SELFTEST FAIL: '$label' should be rejected but passed (vacuous pass?)"; cat /tmp/dco-out; exit 1
            fi
            echo "ok: $label ($want, exit $rc)"
          }

          # 1. matching sign-off -> accepted
          git commit -q --allow-empty -s -m "good commit"
          good="$(git rev-parse HEAD)"
          expect pass "matching sign-off" "$base" "$good"

          # 2. unresolvable base -> must FAIL, not pass with zero commits
          expect fail "unresolvable base sha" "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef" "$good"

          # 3. empty range -> must FAIL
          expect fail "empty range" "$good" "$good"

          # 4. no sign-off -> rejected
          git commit -q --allow-empty -m "unsigned commit"
          unsigned="$(git rev-parse HEAD)"
          expect fail "missing sign-off" "$good" "$unsigned"

          # 5. sign-off naming someone else -> rejected
          git commit -q --allow-empty -m "forged

          Signed-off-by: Someone Else <else@example.invalid>"
          forged="$(git rev-parse HEAD)"
          expect fail "sign-off by another person" "$unsigned" "$forged"

          # 6. sign-off text only in the body, not a trailer -> rejected
          git commit -q --allow-empty -m "pasted

          here is a log excerpt: Signed-off-by: Test Author <author@example.invalid> and more text
          still body"
          pasted="$(git rev-parse HEAD)"
          expect fail "sign-off text outside the trailer block" "$forged" "$pasted"

          # 7. the Dependabot exception (scripts/dco-check.sh): authored as
          #    the noreply bot address, signed as support@github.com -> ACCEPTED
          git commit -q --allow-empty --author="dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" -m "bump x

          Signed-off-by: dependabot[bot] <support@github.com>"
          dep="$(git rev-parse HEAD)"
          expect pass "dependabot author with its support@github.com sign-off" "$pasted" "$dep"

          # 8. near miss: the same sign-off on a bot-lookalike author with a
          #    different numeric id -> REJECTED (the exception names one pair)
          git commit -q --allow-empty --author="dependabot[bot] <12345+dependabot[bot]@users.noreply.github.com>" -m "bump y

          Signed-off-by: dependabot[bot] <support@github.com>"
          lookalike="$(git rev-parse HEAD)"
          expect fail "dependabot-lookalike author id" "$dep" "$lookalike"

          # 9. near miss: a HUMAN author with the support@github.com sign-off
          #    -> REJECTED
          git commit -q --allow-empty -m "human

          Signed-off-by: dependabot[bot] <support@github.com>"
          human="$(git rev-parse HEAD)"
          expect fail "human author signed off as dependabot" "$lookalike" "$human"
