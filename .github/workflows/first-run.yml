# Post-release first-run smoke: does the PUBLISHED release work for a stranger?
#
# After a release is fully published (tarballs + ghcr images + channels check),
# install it the way the README tells a user to -- scripts/install.sh from the
# tag, on clean debian / ubuntu / fedora containers -- start the daemon against
# the bundled sample corpus and check the SPA, keyword search, the watcher and
# `kb daemon doctor`. A fourth leg pulls the ghcr image anonymously and runs it.
# scripts/ci/first-run-smoke.sh is the single source of truth for the checks.
#
# WHERE THE CODE COMES FROM: the harness (this workflow, first-run-smoke.sh,
# first-run-hits.sh) runs from the workflow's OWN ref (main), never from the
# tag, so a harness fix applies to an already-published release. Only what a
# user gets from the tag is taken from it: a second checkout of the tag lands
# in release/ and supplies scripts/install.sh (tarball legs) and corpus/canon
# (docker leg). Provenance/attestation checks are install.sh's and unchanged.
#
# WHY `workflow_run` AND NOT a release-published trigger: the release is
# created by release.yml with the default GITHUB_TOKEN, and events created with
# that token never start other workflows. It is also created BEFORE the
# per-target tarballs are uploaded, so such a trigger would race the assets.
# `workflow_run` fires when release.yml has finished (tarballs, images and the
# channels-exist probe done). It only runs from the default branch's copy of
# this file, so the first release after merging is the first automatic run;
# `workflow_dispatch` (input: tag) is the manual path.
#
# This workflow REPORTS. It does not gate, unpublish or demote a release, and
# release.yml does not depend on it. No secrets, no write permissions.
name: first-run

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke-test, e.g. v0.44"
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: resolve tag
    # A completed release.yml run caused by a tag push that succeeded, in this
    # repository (not a fork); or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.repository == 'nicolasacchi/kb'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-cpu","cpu-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            # A tag-push run reports the tag name as head_branch; confirm via the API.
            tag="$RUN_HEAD_BRANCH"
            if ! [[ "$tag" =~ ^v[0-9] ]]; then
              tag="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_branch)"
            fi
          fi
          if ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' does not look like a release tag (vN.N...)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing release $tag" >> "$GITHUB_STEP_SUMMARY"

  tarball:
    name: tarball (${{ matrix.name }})
    needs: resolve
    runs-on: ${{ matrix.runner == 'ubuntu-latest' && github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-cpu","cpu-ci"]') || matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-trixie
            runner: ubuntu-latest
            image: debian:trixie
            pm: apt
            require_provenance: "1"
          - name: ubuntu-24.04
            runner: ubuntu-latest
            image: ubuntu:24.04
            pm: apt
            require_provenance: "0"
          - name: fedora-latest
            runner: ubuntu-latest
            image: fedora:latest
            pm: dnf
            require_provenance: "0"
          - name: debian-trixie-aarch64
            runner: ubuntu-24.04-arm
            image: debian:trixie
            pm: apt
            require_provenance: "0"
    container:
      image: ${{ matrix.image }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Container prep (curl, git, procps, gh)
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          if [ "$PM" = apt ]; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              curl ca-certificates tar gzip procps git
          else
            dnf install -y -q curl ca-certificates tar gzip procps-ng git
          fi
          # Distro gh builds predate `gh attestation verify` (added in 2.49), so
          # install a pinned upstream gh, checksum-verified, for provenance.
          ghv=2.102.0
          case "$(uname -m)" in
            x86_64)  garch=amd64; gsum=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 ;;
            aarch64) garch=arm64; gsum=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484 ;;
            *) echo "::error::unsupported arch"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/gh.tgz \
            "https://github.com/cli/cli/releases/download/v${ghv}/gh_${ghv}_linux_${garch}.tar.gz"
          echo "${gsum}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          install -m 0755 "/tmp/gh_${ghv}_linux_${garch}/bin/gh" /usr/local/bin/gh
          gh --version
          ldd --version 2>&1 | sed -n 1p
      # HARNESS = this workflow's own ref (main), so a harness fix applies to an
      # already-published tag. RELEASE = the tag, in release/: only what a user
      # actually gets from it (scripts/install.sh, corpus/canon) is taken from there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: release
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: First-run smoke (harness from main, installer + tarball from the tag)
        env:
          KB_VERSION: ${{ needs.resolve.outputs.version }}
          LEG: tarball-${{ matrix.name }}
          REQUIRE_PROVENANCE: ${{ matrix.require_provenance }}
          INSTALL_SH: ${{ github.workspace }}/release/scripts/install.sh
        run: |
          set -euo pipefail
          # Retry once: release assets can lag the CDN for a moment.
          # Only a failure of the install step (download/verify) is retried; a failure
          # of any later step is a real finding and fails at once.
          for attempt in 1 2; do
            if bash scripts/ci/first-run-smoke.sh 2>&1 | tee smoke.log; then ok=1; break; fi
            ok=0
            if [ "$attempt" = 1 ] && grep -q '^STEP 1/[0-9]* install ... FAIL' smoke.log; then
              echo "install step failed (asset/CDN lag?); retrying once"; sleep 30
            else
              break
            fi
          done
          [ "$ok" = 1 ]
      - name: Summary
        if: always()
        run: |
          {
            echo "### tarball ${{ matrix.name }}"
            echo '```'
            grep -E '^(STEP|PROVENANCE|RESULT)' smoke.log || echo "no smoke output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Documented one-liner still resolves (non-gating)
        continue-on-error: true
        run: curl -fsSL -o /dev/null https://raw.githubusercontent.com/nicolasacchi/kb/main/scripts/install.sh

  docker:
    name: docker (ghcr image, anonymous pull)
    needs: resolve
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-cpu","cpu-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/nicolasacchi/kb:${{ needs.resolve.outputs.version }}
      # Probe inside the image's network namespace: its default addr/CMD and
      # HEALTHCHECK stay loopback-only, even with a remote rootless TLS daemon.
      # No host socket, host networking or published port is needed.
    steps:
      # HARNESS = this workflow's own ref (main), so a harness fix applies to an
      # already-published tag. RELEASE = the tag, in release/: only what a user
      # actually gets from it (scripts/install.sh, corpus/canon) is taken from there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: release
          persist-credentials: false
      - name: Pull anonymously (no registry login on purpose)
        run: |
          for attempt in 1 2 3; do
            docker pull "$IMAGE" && exit 0
            echo "pull attempt $attempt failed"; sleep 30
          done
          exit 1
      - name: Prepare shared Docker scratch
        run: |
          set -euo pipefail
          # The runner and remote daemon share this workspace at the SAME path;
          # /tmp belongs to the runner alone and cannot supply remote bind mounts.
          scratch="$(mktemp -d "$GITHUB_WORKSPACE/.first-run-docker.XXXXXX")"
          chmod 755 "$scratch"
          echo "DOCKER_SCRATCH=$scratch" >> "$GITHUB_ENV"
          echo "CONTAINER=kb-first-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          owner="$(docker run --rm --entrypoint sh "$IMAGE" -c 'printf "%s:%s" "$(id -u)" "$(id -g)"')"
          echo "IMAGE_OWNER=$owner" >> "$GITHUB_ENV"
      - name: Run the image against the sample corpus
        run: |
          set -euo pipefail
          T="$DOCKER_SCRATCH/keyword"
          mkdir -p "$T/config/kb" "$T/state"
          # The sample corpus is not baked into the image: mount it from the tag.
          cp -R release/corpus/canon "$T/corpus"
          # Keyword-only, like the tarball legs: the gate is "image boots, serves
          # the SPA, indexes and answers BM25". The image bakes bge-large but the
          # registry default (what a config without embedding_model resolves to)
          # is bge-small, so without this the daemon fetches a model at boot; the
          # "default config" step below probes that path separately, non-gating.
          cat > "$T/config/kb/kb.toml" <<'TOML'
          [defaults]
          disable_embedder_fallback = true

          [kb.canon]
          path = "/corpus"
          TOML
          # Chown in the DAEMON's user namespace, not the runner's: rootless
          # Docker maps the image UID to a subordinate host UID. No world-writable
          # config/state, and the image still runs as its declared non-root user.
          docker run --rm --user 0:0 --entrypoint sh \
            --mount "type=bind,source=$T,target=/scratch" "$IMAGE" \
            -c 'chown -R "$1" /scratch/config /scratch/state; chmod -R u+rwX,go-rwx /scratch/config /scratch/state' sh "$IMAGE_OWNER"
          docker run -d --name "$CONTAINER" \
            --mount "type=bind,source=$T/config,target=/var/lib/kb/config" \
            --mount "type=bind,source=$T/state,target=/var/lib/kb/state" \
            --mount "type=bind,source=$T/corpus,target=/corpus,readonly" \
            "$IMAGE"
          for i in $(seq 1 60); do
            docker exec "$CONTAINER" curl -fsS --max-time 3 http://127.0.0.1:4000/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec "$CONTAINER" curl -fsS http://127.0.0.1:4000/healthz
          code="$(docker exec "$CONTAINER" curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/)"
          docker exec "$CONTAINER" curl -fsS http://127.0.0.1:4000/ >root.html
          [ "$code" = 200 ] && grep -q '<div id="root"' root.html
          found=0
          for i in $(seq 1 60); do
            docker exec "$CONTAINER" kb search borrow --kb canon --mode keyword --json >search.last 2>&1 || true
            n="$(bash scripts/ci/first-run-hits.sh search.last)"
            if [ "${n:-0}" -ge 1 ]; then found=1; break; fi
            sleep 3
          done
          if [ "$found" != 1 ]; then
            echo "---- last kb search output ----"; sed -n '1,40p' search.last
            echo "---- kb status ----"; docker exec "$CONTAINER" kb status 2>&1 | sed -n '1,40p' || true
            exit 1
          fi
          docker exec "$CONTAINER" kb daemon doctor
          for i in $(seq 1 30); do
            st="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER")"
            [ "$st" = healthy ] && break
            sleep 5
          done
          [ "$st" = healthy ]
          # A healthy loopback endpoint must NOT also accept on the bridge IP.
          ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER")"
          [ -n "$ip" ]
          if docker exec "$CONTAINER" curl --noproxy '*' -fsS --max-time 3 "http://$ip:4000/healthz"; then
            echo "::error::image unexpectedly accepts non-loopback connections"
            exit 1
          else
            [ "$?" = 7 ] # curl's connect failure, not an unrelated exec error
          fi
          echo "RESULT docker PASS"
      - name: Container logs
        if: failure()
        run: docker logs "$CONTAINER" 2>&1 | tail -n 150
      - name: Default config (no embedding_model, as the quickstart writes it) - non-gating probe
        # Answers "does the image index with the config `kb add` produces?" on
        # every run. It does not gate: an embedder-backed first index depends on
        # a model fetch the keyword gate above deliberately avoids.
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          P="$DOCKER_SCRATCH/default"
          mkdir -p "$P/config/kb" "$P/state"
          cp -R release/corpus/canon "$P/corpus"
          printf '[kb.canon]\npath = "/corpus"\n' > "$P/config/kb/kb.toml"
          docker run --rm --user 0:0 --entrypoint sh \
            --mount "type=bind,source=$P,target=/scratch" "$IMAGE" \
            -c 'chown -R "$1" /scratch/config /scratch/state; chmod -R u+rwX,go-rwx /scratch/config /scratch/state' sh "$IMAGE_OWNER"
          docker run -d --name "$CONTAINER" \
            --mount "type=bind,source=$P/config,target=/var/lib/kb/config" \
            --mount "type=bind,source=$P/state,target=/var/lib/kb/state" \
            --mount "type=bind,source=$P/corpus,target=/corpus,readonly" "$IMAGE" >/dev/null
          for i in $(seq 1 60); do
            docker exec "$CONTAINER" curl -fsS --max-time 3 http://127.0.0.1:4000/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          found=0
          for i in $(seq 1 40); do
            docker exec "$CONTAINER" kb search borrow --kb canon --mode keyword --json >probe.last 2>&1 || true
            n="$(bash scripts/ci/first-run-hits.sh probe.last)"
            if [ "${n:-0}" -ge 1 ]; then found=1; break; fi
            sleep 3
          done
          echo "default-config keyword hits found=$found after ~$((i * 3))s"
          if [ "$found" != 1 ]; then
            sed -n '1,40p' probe.last
            docker exec "$CONTAINER" kb status 2>&1 | sed -n '1,40p' || true
            docker logs "$CONTAINER" 2>&1 | grep -v 'lance::dataset::scanner' | tail -n 60 || true
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${CONTAINER:-}" ]; then
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          fi
          if [ -n "${DOCKER_SCRATCH:-}" ] && [ -d "$DOCKER_SCRATCH" ]; then
            # The daemon owns subordinate-UID files; remove only this job's two
            # scratch legs in its namespace before the runner removes the root.
            docker run --rm --user 0:0 --entrypoint sh \
              --mount "type=bind,source=$DOCKER_SCRATCH,target=/scratch" "$IMAGE" \
              -c 'rm -rf /scratch/keyword /scratch/default'
            rmdir "$DOCKER_SCRATCH"
          fi
      - name: Summary
        if: always()
        run: |
          echo "### docker ${IMAGE} - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: report
    needs: [resolve, tarball, docker]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-cpu","cpu-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Leg table
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          R_RESOLVE: ${{ needs.resolve.result }}
          R_TARBALL: ${{ needs.tarball.result }}
          R_DOCKER: ${{ needs.docker.result }}
        run: |
          {
            echo "## First-run smoke for ${TAG:-?}"
            echo "| leg | result |"
            echo "|---|---|"
            echo "| resolve | $R_RESOLVE |"
            echo "| tarball (debian, ubuntu, fedora, aarch64) | $R_TARBALL |"
            echo "| docker image | $R_DOCKER |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$R_RESOLVE" = success ] && [ "$R_TARBALL" = success ] && [ "$R_DOCKER" = success ]
