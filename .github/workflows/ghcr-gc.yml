# Garbage-collects old ghcr.io container-image versions for the two
# packages build-image.yml pushes to (`kb`, `kb-code`). Every green main
# commit adds a NEW `main-<sha12>` tag and nothing ever deletes an old one
# (build-image.yml intentionally never overwrites/moves a tag — see its own
# "no moving main-latest" comment), so the version list only grows. Each kb
# image tag is ~919 MB compressed (kb-code's is far smaller, ~116 MB, but
# still adds up) — left alone this is unbounded storage growth for
# artifacts nothing but a manual `docker pull ghcr.io/…:main-<sha12>`
# during a redeploy ever reads.
#
# v0.44 F2: the previous implementation (actions/delete-package-versions with
# an `ignore-versions` regex) logged "Total versions deleted till now: 7" on
# 2026-09-14 and the v0.43 release tags (`0.43`, `latest`) were gone from ghcr
# afterwards; the regex guard did not protect them. Selection is now ours and
# is pinned by scripts/ci/ghcr-gc-selftest.sh: a version is deletable ONLY if
# it has tags and EVERY tag is `main-*`. A version carrying a semver tag,
# `latest`, or any other tag beside a main-* tag is never selected. Untagged
# versions (multi-arch child manifests) are never selected either.
#
# Trusted runs use the repo-scoped cpu-pool runners; fork/external-repo runs use
# GitHub-hosted Ubuntu (see docs/self-hosted-ci.md). Only ghcr.io/GitHub-API
# traffic is needed; the checkout is only for scripts/ghcr-gc.sh.
name: ghcr-gc

on:
  schedule:
    # Weekly, off-peak — well clear of bench-nightly's 03:17 UTC and any
    # build-image run a main push might have queued.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted and delete nothing (default true; scheduled runs delete)"
        type: boolean
        default: true
  # The selection rule is proven on a fixture whenever it (or this file) changes.
  pull_request:
    paths:
      - ".github/workflows/ghcr-gc.yml"
      - "scripts/ghcr-gc.sh"
      - "scripts/ci/ghcr-gc-selftest.sh"
      - "scripts/ci/channels-exist.sh"

# Least privilege: nothing by default; every job below declares its own grants
# (v0.44 F1, review A12.f7).
permissions: {}

# `shell: bash` is GitHub's `bash --noprofile --norc -eo pipefail {0}`; the
# implicit default (`bash -e {0}`) has NO pipefail, so `cmd | tee log` reports
# tee's exit status and a failing `cmd` goes green (the e2e vacuous pass,
# d4f3063d). Setting it once here covers every `run:` step in this file.
defaults:
  run:
    shell: bash

jobs:
  selftest:
    name: gc selection selftest
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove release/latest/mixed/untagged versions are never selected
        run: bash scripts/ci/ghcr-gc-selftest.sh
      - name: Syntax-check the channel probe
        run: bash -n scripts/ci/channels-exist.sh

  gc:
    if: github.event_name != 'pull_request'
    needs: selftest
    permissions:
      contents: read
      packages: write
    name: gc (${{ matrix.package }})
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [kb, kb-code]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prune old main-* versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          OWNER: ${{ github.repository_owner }}
          # Keep the newest 10 main-* versions (~10 weeks of main pushes at a
          # typical cadence). Scheduled runs delete; a manual run defaults to
          # list-only.
          KEEP: "10"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: scripts/ghcr-gc.sh

  # Run after EVERY gc: a prune that took a release image would otherwise stay
  # invisible until a newcomer's `docker pull` 404s. Red here means a documented
  # channel is missing (also red from the day a release has been tagged but its
  # images were never pushed).
  channels-exist:
    if: github.event_name != 'pull_request'
    needs: gc
    name: channels exist (anonymous)
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve :latest and the newest version anonymously
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/channels-exist.sh
