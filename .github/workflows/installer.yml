# scripts/install.sh must fail closed (missing checksum sidecar, missing sha
# tool, failed provenance check = abort) and install the share/ tree next to
# bin/. Self-test against a file:// mirror — no network, no real binaries.
name: installer

on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/ci/install-selftest.sh"
      - "scripts/ci/first-run-smoke.sh"
      - "scripts/ci/first-run-hits.sh"
      - "scripts/ci/first-run-selftest.sh"
      - ".github/workflows/first-run.yml"
      - ".github/workflows/installer.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/ci/install-selftest.sh"
      - "scripts/ci/first-run-smoke.sh"
      - "scripts/ci/first-run-hits.sh"
      - "scripts/ci/first-run-selftest.sh"
      - ".github/workflows/first-run.yml"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  selftest:
    name: install.sh fail-closed selftest
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-cpu","cpu-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh -n scripts/install.sh
      - run: bash scripts/ci/install-selftest.sh
      - run: bash -n scripts/ci/first-run-smoke.sh scripts/ci/first-run-hits.sh scripts/ci/first-run-selftest.sh
      - name: first-run smoke selftest (fake mirror + stub daemon)
        run: bash scripts/ci/first-run-selftest.sh
