# Regenerate the npm lockfiles in CI and push the result to the branch.
#
# WHY THIS EXISTS (v0.44 F1, C1 carry-over): this repo's rule is that nobody
# runs npm on the shared dev host, and a package.json edit without its
# package-lock.json leaves `npm ci` red on every lane. This workflow is the one
# sanctioned place a lockfile is (re)generated: `npm install --package-lock-only`
# in the four package dirs, on node 24 / npm 11 (the lock shape this repo already has; see the step).
#
# HOW TO USE: either dispatch it on the branch (`gh workflow run
# lockfile-regen.yml --ref <branch>`; GitHub only lists a dispatchable workflow
# once it exists on the default branch) or put the `regen-lockfiles` label on
# the pull request. It commits `package-lock.json` changes (DCO sign-off
# included) to the PR branch. A push made with GITHUB_TOKEN does not trigger
# other workflows, so push any follow-up commit (or re-run the checks) afterwards.
#
# The `regen-cargo` job (v0.45 N7) runs after the npm job, re-renders
# THIRD-PARTY-LICENSES.md (cargo-about) and prunes
# Cargo.lock with `cargo update --workspace` (re-resolve against the edited
# manifests; never a blanket `cargo update`). It FAILS if any retained package
# version moved, so the arrow/lance lockstep (invariant #1) cannot drift.
#
# SAFETY: the label path runs only for same-repo PRs; the branch name reaches
# the shell through an env var, never interpolated into the script.
name: lockfile-regen

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: lockfile-regen-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  regen:
    permissions:
      contents: write
    name: regenerate package-lock.json (web, web-code, tests/e2e, web-code/e2e)
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'regen-lockfiles' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js 24 (npm 11)
        # npm 11 writes the lockfile shape this repo already has (it records
        # each native optional dependency's `libc`; npm 10 strips those fields
        # and churns every lock). The lock content does not depend on the
        # node that ran npm, and 24 is inside the engines range
        # (^22.22.2 || >=24.15.0).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: npm install --package-lock-only in each package dir
        run: |
          node --version
          npm --version
          for d in web web-code tests/e2e web-code/e2e; do
            echo "::group::$d"
            (cd "$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Commit and push changed lockfiles
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- '*/package-lock.json'; then
            echo "lockfiles already current; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/package-lock.json web-code/package-lock.json tests/e2e/package-lock.json web-code/e2e/package-lock.json
          git commit -s -m "chore(deps): regenerate npm lockfiles in CI (lockfile-regen)"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

  regen-cargo:
    permissions:
      contents: write
    name: regenerate Cargo.lock + THIRD-PARTY-LICENSES.md (prune only, no version moves)
    needs: regen
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    if: >-
      !cancelled() && needs.regen.result == 'success' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'regen-lockfiles' &&
       github.event.pull_request.head.repo.full_name == github.repository))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: cargo update --workspace (prune, assert no version moved)
        run: |
          cargo --version
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo update --workspace
          cargo metadata --locked --format-version 1 > /dev/null
          # A line diff is not a reliable "did a version move" test (git
          # re-aligns removed blocks and shows unrelated `+version` lines), so
          # compare the (name, version) SETS: the pruned lock must be a subset.
          python3 - <<'PY'
          import sys, tomllib
          def load(p):
              with open(p, "rb") as f:
                  return {(x["name"], x["version"]) for x in tomllib.load(f)["package"]}
          before, after = load("/tmp/Cargo.lock.before"), load("Cargo.lock")
          print(f"packages: {len(before)} -> {len(after)}")
          added = sorted(after - before)
          if added:
              print("::error::cargo update --workspace added/moved packages: " + ", ".join(f"{n} {v}" for n, v in added))
              sys.exit(1)
          PY

      - name: Install cargo-about (pinned like the supply-chain job)
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-about@0.9.2

      - name: Regenerate THIRD-PARTY-LICENSES.md from the pruned lock
        # The supply-chain job's `licenses-set-check` compares per-license
        # COUNTS, which this render reproduces; the text order is cache-state
        # dependent and is not gated.
        run: cargo about generate about.hbs > THIRD-PARTY-LICENSES.md

      - name: Commit and push Cargo.lock + THIRD-PARTY-LICENSES.md
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- Cargo.lock THIRD-PARTY-LICENSES.md; then
            echo "Cargo.lock and THIRD-PARTY-LICENSES.md already current; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock THIRD-PARTY-LICENSES.md
          git commit -s -m "chore(deps): regenerate Cargo.lock and THIRD-PARTY-LICENSES.md in CI (lockfile-regen)"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
