# kb release pipeline — runs on a `v*` tag push.
#
# ── cargo-dist vs. hand-rolled: HAND-ROLLED (this file) ──────────────────────
# cargo-dist is the usual "one command, whole release" tool, but it fights two
# hard constraints here, so it was rejected in favour of this hand-rolled file:
#
#   1. Two binaries, one deliberately excluded from the workspace. kb ships
#      `kb` (kb-cli) AND `kb-embedder`, and invariant #26 / docs/self-host.md
#      require them built in SEPARATE `cargo build` invocations — a single
#      invocation unifies kb-core's `local-embedder` feature and links ONNX
#      Runtime into the `kb` binary too. cargo-dist models a workspace and
#      builds its members together; steering it away from that (and keeping
#      kb-embedder's static-ORT build isolated) is exactly the shape it makes
#      awkward. Hand-rolled, the five `cargo build` steps below are explicit.
#   2. SHA-pinned actions. ci.yml pins every third-party action to a 40-char
#      commit SHA. cargo-dist GENERATES its own release workflow (via
#      `dist generate`) using tag/floating action refs and expects to own that
#      file — re-pinning by hand would drift on every `dist` upgrade. This file
#      instead mirrors ci.yml's pins and, where possible, uses the preinstalled
#      `gh` and `docker` CLIs in `run:` steps so there are NO extra actions to
#      pin at all (only checkout / rust-toolchain / rust-cache, all from ci.yml).
#
# Runners: GitHub-hosted throughout (ubuntu-latest for the release/ghcr
# jobs, ubuntu-24.04 + the native ubuntu-24.04-arm for the binary matrix) —
# the same posture as every other workflow in this repository. Action SHA
# pins are copied verbatim from ci.yml.
#
# Injection-safety: every `${{ … }}` expression is passed through `env:` and
# referenced as a shell variable inside `run:` — never interpolated into a
# command body (see the GitHub Actions workflow-injection guidance).
#
# ── What a `v*` tag ships: BOTH halves ──────────────────────────────────────
# One tag, two shipping surfaces, from this one file:
#
#   kb       kb-<ver>-<triple>.tar.gz        kb, kb-embedder
#            ghcr.io/nicolasacchi/kb:<ver>   + :latest
#   kb-code  kb-code-<ver>-<triple>.tar.gz   kb-code-server, kb-code, kb-lip
#            ghcr.io/nicolasacchi/kb-code:<ver>  + :latest
#
# kb-code is the SIBLING read-first code-browsing daemon (crates/kb-code-server
# + crates/kb-code-cli) and kb-lip its standalone opt-in LSP->HTTP adapter
# (crates/kb-lip) — a separate daemon that ships from the same repo and the
# same tag, never a subcommand of `kb`.
#
# ADDITIVE, never a repack: the kb tarball's filename, contents (kb +
# kb-embedder + INSTALL) and INSTALL text are byte-for-byte what they were
# before kb-code was added here, and `scripts/install.sh` — which resolves
# `kb-<version>-<triple>.tar.gz` and its `.sha256` by name — is untouched. A
# kb-code packaging failure can never alter a kb asset.
#
# Neither tarball bundles its SPA. The kb tarball has always shipped without
# `web/dist` (the daemon serves it from disk; you build it with `just ci-spa`),
# and the kb-code tarball MIRRORS that: no `web-code/dist`, built with `just
# ci-code-spa` and pointed at via KB_CODE_SPA_DIST. The container images bake
# both SPAs in — that is the difference between the two channels, and keeping
# it uniform across the two archives is deliberate.
#
# TODO(verify-after-public): nothing here can run until the repo is public and a
# `v*` tag is pushed — release creation, asset upload, the ubuntu-24.04-arm
# runner, and the ghcr push are all unverified locally. Push a throwaway
# pre-release tag (e.g. v0.0.0-rc1) on a private-then-public repo to smoke it.

name: release

on:
  push:
    tags: ["v*"]

# Least privilege by default; jobs widen as needed.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Ensure a GitHub Release exists for the tag ──────────────────────────
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing"
          else
            gh release create "$TAG" \
              --title "kb $TAG" \
              --generate-notes \
              --verify-tag
          fi

  # ── 2. Per-target release binaries (kb + kb-embedder) ──────────────────────
  binaries:
    name: binaries (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    # 90 -> 180 when kb-code's three binaries joined this job (see the
    # SAME-JOB note above the kb-code build steps for the measured basis).
    # Still an order of magnitude under GitHub's hard 360-minute per-job cap;
    # this job uploads release assets and gates nothing, so a generous
    # ceiling costs nothing and a too-tight one throws away a full compile.
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-24.04 (NOT ubuntu-latest, which floats to 26.04 and
          # would silently RAISE the floor). This is the LOWEST base kb-embedder
          # can build on: its statically-bundled ONNX Runtime prebuilt needs
          # GCC 12+ / libstdc++ GLIBCXX_3.4.30 to LINK and glibc >= 2.39 at RUN
          # time (measured 2026-07-03: kb maxes at GLIBC_2.39; kb-embedder at
          # GLIBC_2.39 + GLIBCXX_3.4.30). A ubuntu-22.04 build was VERIFIED to
          # FAIL: kb-embedder won't link against 22.04's GCC 11 (GLIBCXX_3.4.29).
          # DOCUMENTED FLOOR for the prebuilt bundle: glibc >= 2.39 = Debian 13+,
          # Ubuntu 24.04+, Fedora 40+. Older (Debian 12 = 2.36, Ubuntu 22.04 =
          # 2.35, RHEL 9 = 2.34) and musl (Alpine) users take the ghcr image
          # (self-contained, built on trixie) or build from source. This ORT
          # floor is the same force that moved the prod Dockerfile bookworm to
          # trixie.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          # Native arm64 Linux runner (no QEMU cross-compile). Free ONLY for
          # public repos.
          # TODO(verify-after-public): (a) the org must have `ubuntu-24.04-arm`
          # available (public-repo hosted runners); (b) kb-embedder's aarch64
          # build needs ort-sys to find an aarch64-linux ONNX Runtime prebuilt
          # on the CDN — if that prebuilt is absent the embedder link fails and
          # this leg needs ORT_STRATEGY=system + ORT_LIB_LOCATION=<dir with a
          # system libonnxruntime>. `fail-fast: false` keeps a failure here from
          # sinking the x64 leg; drop this matrix row if it can't go
          # green.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free disk space (drop preinstalled SDKs)
        # The release link (lance + datafusion, plus static ORT for the
        # embedder) is heavy; reclaim ~20 GB so it can't run the runner dry.
        # Mirrors ci.yml's guard. Best-effort — missing dirs are ignored.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Install protoc (Linux — lancedb transitive dep)
        # libprotobuf-dev ships the well-known-type includes
        # (google/protobuf/empty.proto, ...) that lance-encoding's build imports;
        # protobuf-compiler alone provides only the binary and fails with
        # "google/protobuf/empty.proto: File not found" (matches the prod
        # Dockerfile, which installs both).
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust toolchain
        # Mirrors ci.yml: pinned to rust-toolchain.toml's version, NOT @stable
        # (which would drift). This is the one action ci.yml pins by version tag
        # rather than a 40-char SHA — kept identical here on purpose.
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # Two SEPARATE cargo invocations — invariant #26 + docs/self-host.md.
      # Building kb-cli and kb-embedder together unifies kb-core's
      # `local-embedder` feature and links ONNX Runtime into `kb`. Kept apart,
      # the `kb` binary links ZERO ORT; only `kb-embedder` bundles it (static,
      # from the ort-sys CDN prebuilt).
      - name: Build kb (no ORT)
        run: cargo build --release --locked -p kb-cli --bin kb

      - name: Build kb-embedder (static ORT)
        run: cargo build --release --locked -p kb-embedder --bin kb-embedder

      # ── kb-code's three binaries ─────────────────────────────────────────
      # SAME JOB, not a parallel `binaries-code` one. Measured from the last
      # three green release runs (per-target `binaries` job wall clock):
      #
      #   v0.42   x86_64 57.7 min   aarch64 41.6 min
      #   v0.41   x86_64 48.3 min   aarch64 43.6 min
      #   v0.40.2 x86_64 56.8 min   aarch64 42.2 min
      #
      # ~58 min is the worst leg for kb + kb-embedder. kb-code-server links
      # kb-core, so the dominant cost — the lance/datafusion/arrow release
      # graph — is ALREADY compiled in this job's target dir by the `kb` step
      # above; what is left is kb-code's own surface (gix, tree-sitter, grep-*,
      # nucleo) plus three LTO links. ci.yml's `code` job, which compiles that
      # same surface from a cold-ish cache, runs 42-51 min for a full debug
      # clippy+test sweep, so the marginal release cost here is bounded well
      # under an hour: ~110 min worst case for the whole leg, against the ~4 h
      # threshold at which a split would be worth its own cold rebuild of the
      # shared graph. A separate job would recompile that graph from scratch
      # for a wall-clock saving this pipeline does not need.
      #
      # Separate invocations again, but NOT for invariant #26's reason: none
      # of these three enables kb-core's `local-embedder`, so none of them can
      # link ONNX Runtime. What matters is that they stay OUT of the
      # kb-embedder invocation above (which WOULD unify that feature into
      # them); splitting one-per-binary on top of that is for legibility —
      # a failure and its wall-clock cost land on the binary that caused them.
      #
      # `--bin` is load-bearing on kb-lip: that crate also declares
      # `kb-lip-fake-lsp`, a test-only stdio LSP fixture that must never ship.
      #
      # No extra system dependency: kb-code-server reaches lance through
      # kb-core, which the protoc install above already covers, and its
      # tree-sitter grammars build through `cc`, present on every ubuntu
      # runner image. This mirrors ci.yml's `code` job, whose only apt step is
      # that same protoc pair.
      - name: Build kb-code-server
        run: cargo build --release --locked -p kb-code-server --bin kb-code-server

      - name: Build kb-code (CLI)
        run: cargo build --release --locked -p kb-code-cli --bin kb-code

      - name: Build kb-lip (LSP -> HTTP adapter)
        run: cargo build --release --locked -p kb-lip --bin kb-lip

      - name: Package archive
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="kb-${VERSION}-${TARGET}"
          mkdir "$PKG"
          cp target/release/kb target/release/kb-embedder "$PKG/"
          strip "$PKG/kb" "$PKG/kb-embedder" || true
          cat > "$PKG/INSTALL" <<EOF
          kb ${VERSION} — ${TARGET}

          Contents:
            kb            the CLI + daemon
            kb-embedder   the embedding / rerank sidecar (spawned by the daemon)

          Install both into ONE directory — the daemon finds kb-embedder as a
          sibling of the running kb (architecture invariant #26):

            install -m 0755 kb kb-embedder ~/.local/bin/

          Then:  kb daemon        # → http://127.0.0.1:4000/

          The web UI is NOT bundled here. Build it once with the repo's
          'just ci-spa' (writes web/dist, which the daemon serves), or run the
          all-in-one container which bakes in the SPA + an embedding model:
            docker run -p 4000:4000 ghcr.io/nicolasacchi/kb:${VERSION}

          Docs: https://github.com/nicolasacchi/kb
          EOF
          tar -czf "${PKG}.tar.gz" "$PKG"
          # Checksum sidecar (install.sh consumes it).
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "archive=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber

      - name: Package kb-code archive
        # A SECOND, independent archive — same shape as the kb one above
        # (one top-level `<name>-<version>-<triple>/` dir holding stripped
        # binaries + an INSTALL note, gzip tar, `.sha256` sidecar), never a
        # repack of it. `scripts/install.sh` resolves `kb-<ver>-<triple>` by
        # name and is unaffected by a sibling asset.
        #
        # NO `web-code/dist` here, deliberately: the kb tarball has never
        # bundled `web/dist` either (both daemons resolve their SPA from disk
        # at boot — KB_SPA_DIST / KB_CODE_SPA_DIST), so shipping one SPA and
        # not the other would be the inconsistency. The INSTALL note points at
        # `just ci-code-spa` + KB_CODE_SPA_DIST, exactly as kb's points at
        # `just ci-spa`; the container images are the batteries-included
        # channel for both.
        id: pkg_code
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="kb-code-${VERSION}-${TARGET}"
          mkdir "$PKG"
          cp target/release/kb-code-server target/release/kb-code \
             target/release/kb-lip "$PKG/"
          strip "$PKG/kb-code-server" "$PKG/kb-code" "$PKG/kb-lip" || true
          cat > "$PKG/INSTALL" <<EOF
          kb-code ${VERSION} — ${TARGET}

          The sibling read-first code-browsing daemon. Ships from the same tag
          as kb, runs as its own process on its own port — not a kb subcommand.

          Contents:
            kb-code-server   the daemon (defaults to 127.0.0.1:4747)
            kb-code          its CLI — one verb per server surface
            kb-lip           OPTIONAL LSP -> HTTP adapter (lip/1). A standalone
                             process you run yourself; kb-code-server only ever
                             talks to it over HTTP ([[intel.providers]]), never
                             links or spawns it.

          Install into a directory on your PATH:

            install -m 0755 kb-code-server kb-code kb-lip ~/.local/bin/

          Then:  kb-code-server        # reads <config-dir>/kb-code.toml
                                       # → http://127.0.0.1:4747/

          Needs a real 'git' binary on PATH — blame / diff / checkout shell out
          to it.

          The web-code reader UI is NOT bundled here, matching the kb tarball.
          Build it once with the repo's 'just ci-code-spa' (writes
          web-code/dist) and point the daemon at it:
            KB_CODE_SPA_DIST=/abs/path/to/web-code/dist kb-code-server
          Or run the container, which bakes the UI in:
            docker run -p 4747:4747 ghcr.io/nicolasacchi/kb-code:${VERSION}

          Docs: https://github.com/nicolasacchi/kb
          EOF
          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "archive=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload kb-code assets to the release
        # Its OWN step against the SAME release, `--clobber` like the kb
        # upload — so a re-run of this workflow replaces both archives rather
        # than 422-ing on an existing asset name.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.pkg_code.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber

  # ── 3. Container images → ghcr.io ──────────────────────────────────────────
  ghcr:
    name: ghcr images (kb + kb-code)
    runs-on: ubuntu-latest
    # Independent of `binaries` — builds the existing repo-root Dockerfile,
    # BOTH of its runtime targets: `kb-code-runtime` and the default (last)
    # `runtime` stage, which is kb's. Same pair, same Dockerfile and same
    # plain-docker shape build-image.yml publishes on every green main.
    #
    # 120 -> 330: this job now runs two full image builds. The kb image alone
    # measured 55.2 / 57.0 / 59.5 min on the last three green release runs
    # (v0.40.2 / v0.41 / v0.42); kb-code adds one more cargo invocation on top
    # of the SHARED `workspace` stage. 330 is build-image.yml's own budget for
    # exactly this two-image build, and stays under GitHub's hard 360-minute
    # per-job cap. This job publishes artifacts and gates nothing, so a
    # generous ceiling costs nothing and a tight one discards hours of compute.
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free disk space (drop preinstalled SDKs)
        # The kb image is ~1.7 GB (bakes in the ~1.34 GB bge-large model) on
        # top of a full release compile, and this job now builds kb-code's
        # image before it — reclaim headroom before either docker build.
        # Widened to build-image.yml's exact list (adds the CodeQL toolcache
        # and the preloaded container images) because this job now does the
        # same two-image build that one does, and that list is the one proven
        # to carry it. Best-effort — missing dirs are ignored.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Log in to ghcr.io
        # Preinstalled docker CLI + the job's GITHUB_TOKEN — no third-party
        # login action to pin. packages:write above grants the push. Both values
        # arrive via env (never interpolated into the command body).
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Resolve image names + version
        # One place derives all three values the two build steps share, so the
        # kb and kb-code tags can never be computed from different inputs.
        # `<image>-code` is the SAME derivation build-image.yml uses for the
        # sibling package (ghcr.io/nicolasacchi/kb -> …/kb-code). Both
        # expression values arrive via `env:` and are referenced as shell
        # variables — never interpolated into the command body.
        id: img
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=${IMAGE}"
            echo "code_image=${IMAGE}-code"
            echo "version=${REF_NAME#v}"
            echo "sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      # ORDER: kb-code first, then kb — build-image.yml's ordering, for its
      # reasons. kb-code-runtime is the SMALL image (no embedder, no ONNX
      # Runtime, no 1.34 GB model), so it reaches ghcr.io roughly an hour
      # sooner this way, and its build produces the shared `workspace` stage
      # (fetched dep graph + sources) that kb's build then reuses from the
      # local build cache instead of redoing.
      - name: Build + push kb-code image
        # `--target kb-code-runtime`: the Dockerfile's LAST stage is kb's
        # `runtime` on purpose (a bare `docker build` must keep shipping kb),
        # so kb-code is only ever reachable by explicit target.
        # Same KB_GIT_SHA build arg as kb below — the `.dockerignore` drops
        # `.git`, so neither builder stage can probe the sha itself, and both
        # kb-code-builder and kb-code-runtime declare the ARG (build stamp +
        # the OCI version label).
        # TODO(verify-after-public): the first push creates a SECOND package,
        # `kb-code`, which may also land PRIVATE — set it public alongside `kb`
        # in the repo's Packages settings if `docker pull` should be open.
        env:
          CODE_IMAGE: ${{ steps.img.outputs.code_image }}
          VERSION: ${{ steps.img.outputs.version }}
          SHA: ${{ steps.img.outputs.sha }}
        run: |
          set -euo pipefail
          docker build \
            --target kb-code-runtime \
            --build-arg KB_GIT_SHA="$SHA" \
            -t "${CODE_IMAGE}:${VERSION}" \
            -t "${CODE_IMAGE}:latest" \
            .
          docker push "${CODE_IMAGE}:${VERSION}"
          docker push "${CODE_IMAGE}:latest"

      - name: Reclaim disk between the two image builds
        # The kb-code image is already ON ghcr at this point, so its local
        # copy is dead weight in front of kb's much larger build. Honest about
        # the size: kb-code-runtime is the small one (~116 MB compressed), so
        # this frees a few hundred MB — the real headroom comes from the
        # widened up-front reclaim above. The step earns its place mainly as
        # the `df -h /` CHECKPOINT between the two builds: a full runner
        # surfaces as a SIGBUS'd linker or an opaque BuildKit error, never a
        # clean ENOSPC, so a recorded free-space figure here is what makes the
        # next failure diagnosable.
        #
        # `docker image rm` on the two tags we just pushed, NOT a blanket
        # `docker image prune -af`: a blanket -a prune would also drop the base
        # images kb-code's build pulled (rust:1.96-trixie, node:22-*,
        # debian:trixie-slim — all four shared with kb's build), forcing a
        # re-pull, and it edges closer to the BuildKit cache than this job can
        # afford. That cache is load-bearing: kb's build reuses the shared
        # `workspace` stage kb-code's build just produced, and losing it means
        # a full re-fetch + re-compile of the dep graph. Never `docker builder
        # prune` here.
        env:
          CODE_IMAGE: ${{ steps.img.outputs.code_image }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          docker image rm "${CODE_IMAGE}:${VERSION}" "${CODE_IMAGE}:latest" || true
          df -h /

      - name: Build + push kb image
        # No `--target`: the Dockerfile's last stage IS kb's runtime.
        # Tags: :<version> and :latest, unchanged from before kb-code was
        # added to this job.
        # TODO(verify-after-public): ghcr push needs GitHub Packages enabled for
        # the repo; the first push may create the package as PRIVATE — set it
        # public in the repo's Packages settings if `docker pull` should be open.
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.img.outputs.version }}
          SHA: ${{ steps.img.outputs.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg KB_GIT_SHA="$SHA" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Report what was published
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CODE_IMAGE: ${{ steps.img.outputs.code_image }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "pushed ${CODE_IMAGE}:${VERSION} + :latest"
            echo "pushed ${IMAGE}:${VERSION} + :latest"
          } >> "$GITHUB_STEP_SUMMARY"
