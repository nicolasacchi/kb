# Repo hygiene: (1) the public-repo leak gate over the WHOLE tracked tree, and
# (2) the review-store gate driver's rail self-test (python only, no cargo).
#
# The gate's pattern list is private and lives in the repository secret
# PUBLIC_GATE_PATTERNS (an extended regex). It is never printed: the script
# emits file:line only. On a fork / Dependabot PR the secret is unavailable and
# the gate skips with a notice; on push to main an empty secret FAILS.
name: Repo hygiene

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing by default; every job below declares its own grants
# (v0.44 F1, review A12.f7).
permissions: {}

# `shell: bash` is GitHub's `bash --noprofile --norc -eo pipefail {0}`; the
# implicit default (`bash -e {0}`) has NO pipefail, so `cmd | tee log` reports
# tee's exit status and a failing `cmd` goes green (the e2e vacuous pass,
# d4f3063d). Setting it once here covers every `run:` step in this file.
defaults:
  run:
    shell: bash

jobs:
  public-gate:
    permissions:
      contents: read
    name: Public gate (whole tree)
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grep the tracked tree for the private pattern list
        env:
          PUBLIC_GATE_PATTERNS: ${{ secrets.PUBLIC_GATE_PATTERNS }}
          PUBLIC_GATE_REQUIRED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: scripts/ci/public-gate.sh

  review-store-selftest:
    permissions:
      contents: read
    name: Review-store driver self-test
    runs-on: ${{ github.repository == 'nicolasacchi/kb' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kb-selfhosted","cpu-pool"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the safety rails (path-independent, touches nothing; runner python3 >= 3.11)
        run: python3 scripts/review-store/run_gates.py --self-test
