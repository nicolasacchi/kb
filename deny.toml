# cargo-deny configuration — supply-chain gate for the kb workspace.
# Schema: cargo-deny v2 ([advisories]/[licenses] version = 2). Requires
# cargo-deny >= 0.16 (the EmbarkStudios/cargo-deny-action default is current).
# The v1 `unlicensed`/`copyleft`/`allow-osi-fsf-free`/severity-threshold fields
# are GONE in v2 — do not reintroduce them.
#
# The [licenses].allow list is derived from the ACTUAL dependency graph (790
# crates as of Cargo.lock @ 2026-06): every distinct SPDX identifier that
# appears, after decomposing OR/AND/WITH/slash expressions, is listed. The
# graph contains ZERO GPL/AGPL/SSPL/proprietary (the only LGPL is OR-satisfied
# via MIT in r-efi), so this gate passes today. Re-run `just licenses-graph`
# after a big dep bump and add any new SPDX id here BEFORE it lands, or this
# job fails the PR.

[graph]
# Evaluate the full graph including all features. The `local-embedder` /
# fastembed+ORT path adds NO new license ids (ort/ort-sys are MIT OR Apache-2.0),
# but enable it so the supply-chain gate covers the embedder's deps too.
all-features = true

[advisories]
version = 2
# RustSec advisory DB gate. With version = 2 the default behaviour is:
#   vulnerability  -> deny      (any unpatched RUSTSEC vuln fails CI)
#   unmaintained   -> warn (workspace scope)  — see `unmaintained` below
#   yanked         -> warn   (overridden to DENY below — see `yanked =`)
#   notice/unsound -> warn
# `ignore` is the escape hatch for a vetted, un-actionable advisory: add the
# RUSTSEC id with a one-line justification. Keep this list EMPTY until
# something fires — an empty list documents "clean today".
unmaintained = "workspace"
# Override the v2 default (warn): a yanked crate in Cargo.lock fails CI. A yank
# usually signals a withdrawn/compromised release, so it should block. cargo-deny
# reports 0 yanked crates today (verified), so this only catches NEW yanks.
yanked = "deny"
ignore = [
    # quick-xml 0.39.4 is pinned by object_store 0.13 (`quick-xml ^0.39`),
    # which datafusion 54 (= the ratified lockstep set) requires; the fixed
    # 0.41 line needs object_store 0.14 / datafusion 55 — a future lockstep
    # unit. The vulnerable XML parsing only runs on object_store's cloud
    # (S3/GCS/azure) response paths; kb's build is local-only
    # (`lancedb default-features = false`), so no kb code path parses
    # untrusted XML through it.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 capped by object_store 0.13 (datafusion 54 lockstep); cloud-only XML path, not in kb's local-only build" },
    { id = "RUSTSEC-2026-0195", reason = "same as RUSTSEC-2026-0194 (quick-xml 0.39 via object_store 0.13; cloud-only path)" },
    # rsa Marvin timing sidechannel: "no safe upgrade is available". rsa
    # enters via opendal's reqsign cloud-signing stack (lance-io aws/azure/
    # gcs features) — compiled only in the all-features deny graph, never in
    # kb's local-only build; no kb key material is ever handled by it.
    { id = "RUSTSEC-2023-0071", reason = "no fix exists; rsa via opendal reqsign (cloud signing), unreachable in kb's local-only build" },
]

[licenses]
version = 2
# `confidence-threshold` governs the text-matcher for license-FILE-only crates;
# 0.8 is the cargo-deny default. The graph has no license-file-only crates
# (every crate carries an SPDX `license` field — verified).
confidence-threshold = 0.8

# ── The allow-list ──────────────────────────────────────────────────────────
# Every SPDX id below was observed in the graph (or is required by an AND-clause).
# SPDX evaluation is per-crate: an `A OR B` crate passes if EITHER is allowed;
# an `A AND B` crate needs BOTH (the Unicode + BSD ids are AND-required, not
# optional).
allow = [
    # Permissive — the bulk of the graph (~1190 of the per-term counts).
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",  # rustix, linux-raw-sys, wasm-*, wit-bindgen
    "BSD-2-Clause",
    "BSD-3-Clause",                    # AND-required by some `(Apache/MIT) AND BSD-3-Clause`
    "ISC",
    "0BSD",                            # adler2 (as OR alt), mock_instant
    "Zlib",                            # miniz_oxide etc.
    "BSL-1.0",                         # xxhash-rust (BSL-only); ryu (as OR alt)
    "Unlicense",                       # several crates as `Unlicense OR MIT`
    "MIT-0",                           # constant_time_eq (as OR alt)

    # Public-domain-equivalent.
    "CC0-1.0",                         # notify, tiny-keccak, ...

    # Unicode data licenses — AND-required by icu_* / finl_unicode / wezterm-bidi.
    "Unicode-3.0",                     # icu_* 2.x, zerovec, yoke, tinystr, litemap, ...
    "Unicode-DFS-2016",                # finl_unicode, wezterm-bidi (AND-clause)

    # Data-license — webpki-roots 1.x ships the Mozilla CA set under CDLA.
    "CDLA-Permissive-2.0",

    # Weak (file-level) copyleft. MPL-2.0 obligations are per-file and we link,
    # don't modify, these crates. Several are MPL-ONLY (no OR) so this MUST be
    # allowed: cssparser/cssparser-macros, selectors, dtoa-short (scraper/servo
    # html stack), option-ext (via `directories`), and — as of kb-code Wave 1
    # (W1.1) — nucleo (kb-code-server's fuzzy file/symbol matcher; deliberately
    # allowlisted, MPL-ONLY, no OR alternative).
    "MPL-2.0",
]
# NOTE deliberately NOT allowed:
#   LGPL-2.1-or-later — appears ONLY in r-efi as `MIT OR Apache-2.0 OR
#     LGPL-2.1-or-later`; SPDX OR-evaluation satisfies it via MIT, so the LGPL
#     term is never accepted. Leaving it out keeps a real strong-copyleft
#     license from silently becoming acceptable elsewhere.
#   GPL/AGPL/SSPL — none in the graph; absence here makes any future
#     introduction fail CI loudly. Do not add them.

exceptions = [
    # { allow = ["OpenSSL"], crate = "some-crate" },
]

[bans]
# Multiple-version policy — V76-R4c (DEP-LOCKSTEP): flipped warn → deny.
# Every remaining duplicate is transitive-only (no kb Cargo.toml edge can
# collapse it) and carries a one-line root cause below. V76-R4e collapsed
# the three deferred kb-side majors: toml 0.8→1.1 (toml_edit 0.22→0.25 +
# refinery 0.8→0.9; winnow/toml_datetime/serde_spanned followed out of the
# graph), mdns-sd 0.13→0.21 (socket2 0.5 left the graph), and reqwest
# 0.12→0.13 on kb's direct edge (the last reqwest-eventsource 0.6 call
# site moved to kb-cli's in-house SSE parser; 0.12 stays transitive-only
# via goosefs-sdk, see below).
multiple-versions = "deny"
wildcards = "allow"
deny = []
skip = [
    # lance-namespace-impls 11's REST namespace server stack still on axum 0.7
    # (ours is 0.8); axum-core/matchit/tower-http old lines follow axum 0.7.
    { crate = "axum", version = "0.7.9", reason = "lance-namespace-impls 11 REST stack" },
    { crate = "axum-core", version = "0.4.5", reason = "via axum 0.7" },
    { crate = "matchit", version = "0.7.3", reason = "via axum 0.7" },
    { crate = "tower-http", version = "0.5.2", reason = "via lance-namespace-impls 11" },
    # base64: kb pins 0.22; 0.13 via spm_precompiled (tokenizers), 0.23 via opendal 0.58.
    { crate = "base64", version = "0.13.1", reason = "spm_precompiled (tokenizer chain)" },
    { crate = "base64", version = "0.23.1", reason = "opendal 0.58 (lance-io)" },
    { crate = "bitflags", version = "1.3.2", reason = "kanaria (unicode chain)" },
    # RustCrypto 0.10 chain: sha1-checked (gix-hash), rsa/pkcs5/scrypt
    # (opendal reqsign), aws-config. kb's direct sha1/sha2 edge is on 0.11.
    { crate = "block-buffer", version = "0.10.4", reason = "digest 0.10 chain" },
    { crate = "const-oid", version = "0.9.6", reason = "der/rsa chain" },
    { crate = "cpufeatures", version = "0.2.17", reason = "sha1/sha2 0.10, aes 0.8" },
    { crate = "crypto-common", version = "0.1.7", reason = "digest 0.10 chain" },
    { crate = "digest", version = "0.10.7", reason = "sha1-checked (gix) + rsa chain" },
    { crate = "hmac", version = "0.12.1", reason = "pbkdf2 0.12 (rsa chain)" },
    { crate = "md-5", version = "0.10.6", reason = "object_store 0.13" },
    { crate = "sha1", version = "0.10.7", reason = "sha1-checked 0.10 (gix-hash)" },
    { crate = "sha2", version = "0.10.9", reason = "pkcs5/rsa/scrypt (opendal reqsign)" },
    { crate = "core-foundation", version = "0.9.4", reason = "rustls-platform-verifier/security-framework (macOS)" },
    # lol_html 3.0 pins the older servo stack than scraper 0.27.
    { crate = "cssparser", version = "0.36.0", reason = "lol_html 3 (scraper 0.27 uses 0.37)" },
    { crate = "cssparser-macros", version = "0.6.1", reason = "via cssparser 0.36" },
    { crate = "selectors", version = "0.37.0", reason = "lol_html 3 (scraper 0.27 uses 0.38)" },
    { crate = "darling", version = "0.20.11", reason = "derive_builder 0.20 (transitive)" },
    { crate = "darling_core", version = "0.20.11", reason = "via darling 0.20" },
    { crate = "darling_macro", version = "0.20.11", reason = "via darling 0.20" },
    { crate = "foldhash", version = "0.1.5", reason = "hashbrown 0.15" },
    # getrandom: kb pins 0.4; 0.2 via lance-arrow 11/ring/rand_core 0.6,
    # 0.3 via ahash/jobserver/quinn-proto/tokenizers.
    { crate = "getrandom", version = "0.2.17", reason = "lance-arrow 11, ring" },
    { crate = "getrandom", version = "0.3.4", reason = "ahash, jobserver, quinn-proto" },
    # hashbrown: one version per consumer ecosystem (dashmap 6, petgraph
    # 0.8, clru/quick_cache/safetensors).
    { crate = "hashbrown", version = "0.14.5", reason = "dashmap 6 / hashlink" },
    { crate = "hashbrown", version = "0.15.5", reason = "petgraph 0.8" },
    { crate = "hashbrown", version = "0.16.1", reason = "clru / quick_cache / safetensors" },
    # http 0.2 / http-body 0.4: aws-smithy stack (lance-io aws feature in the
    # all-features deny graph).
    { crate = "http", version = "0.2.12", reason = "aws-sdk smithy stack" },
    { crate = "http-body", version = "0.4.6", reason = "aws-smithy-runtime" },
    { crate = "itertools", version = "0.10.5", reason = "criterion (dev-only)" },
    { crate = "itertools", version = "0.11.0", reason = "earcutr (geo chain)" },
    { crate = "ndarray", version = "0.16.1", reason = "lance-index 11 (fastembed/ort use 0.17)" },
    { crate = "nom", version = "7.1.3", reason = "spm_precompiled (tokenizer chain)" },
    { crate = "phf", version = "0.12.1", reason = "chrono-tz 0.10" },
    { crate = "phf_shared", version = "0.12.1", reason = "via phf 0.12" },
    { crate = "quick-xml", version = "0.39.4", reason = "object_store 0.13" },
    { crate = "r-efi", version = "5.3.0", reason = "getrandom 0.3 (uefi target)" },
    # rand: 0.8 via num-bigint-dig (rsa), 0.9 via tokenizers-era consumers;
    # rand_chacha 0.3 / rand_core 0.6 follow rand 0.8.
    { crate = "rand", version = "0.8.8", reason = "num-bigint-dig (rsa chain)" },
    { crate = "rand", version = "0.9.4", reason = "tokenizers/getrandom-0.3 chain" },
    { crate = "rand_chacha", version = "0.3.1", reason = "via rand 0.8" },
    { crate = "rand_core", version = "0.6.4", reason = "via rand 0.8" },
    { crate = "rand_core", version = "0.9.5", reason = "getrandom 0.3 / tokenizers" },
    # reqwest: kb's direct edge is on 0.13 (V76-R4e; reqwest-eventsource 0.6
    # dropped for kb-cli's in-house SSE parser). 0.12.28 stays transitive-only
    # via goosefs-sdk → opendal-service-goosefs → opendal 0.58 (lance-io) —
    # unmovable without moving the lance set.
    { crate = "reqwest", version = "0.12.28", reason = "goosefs-sdk via opendal 0.58 (lance-io)" },
    { crate = "wasm-streams", version = "0.4.2", reason = "follows reqwest 0.12 (goosefs-sdk)" },
    { crate = "snafu", version = "0.8.9", reason = "lancedb 0.38 (lance uses 0.9)" },
    { crate = "snafu-derive", version = "0.8.9", reason = "via snafu 0.8" },
    { crate = "spin", version = "0.9.9", reason = "flume / lazy_static / multer" },
    { crate = "syn", version = "2.0.117", reason = "proc-macro ecosystem split (3.0 via bytemuck/clap_derive)" },
    { crate = "thiserror", version = "1.0.69", reason = "geoarrow-schema / protobuf" },
    { crate = "thiserror-impl", version = "1.0.69", reason = "via thiserror 1" },
    { crate = "wasi", version = "0.11.1+wasi-snapshot-preview1", reason = "getrandom 0.2 / mio" },
    # windows platform crates: 0.52.6 family via tokio/mio-era consumers,
    # 0.53.x via windows-sys 0.60/0.61.
    { crate = "windows-sys", version = "0.52.0", reason = "mio / older tokio chain" },
    { crate = "windows-sys", version = "0.59.0", reason = "windows 0.58-era consumers" },
    { crate = "windows-sys", version = "0.60.2", reason = "windows 0.60 consumers" },
    { crate = "windows-targets", version = "0.52.6", reason = "via windows-sys 0.52" },
    { crate = "windows_aarch64_gnullvm", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_aarch64_msvc", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_i686_gnu", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_i686_gnullvm", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_i686_msvc", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_x86_64_gnu", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_x86_64_gnullvm", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "windows_x86_64_msvc", version = "0.52.6", reason = "windows 0.52.6 target family (via windows-targets 0.52.6)" },{ crate = "wit-bindgen", version = "0.51.0", reason = "wasip3 (wasi 0.3 toolchain)" },
]
skip-tree = []

[sources]
# Only crates.io (+ workspace path deps) are allowed: an unknown registry or a
# git dependency fails CI — a guard against a typo-squat registry or an unvetted
# git fork sneaking in.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
