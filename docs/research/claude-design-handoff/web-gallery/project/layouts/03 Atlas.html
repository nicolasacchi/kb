<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>kb · atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"/>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #15161a;
    --panel-2: #1c1d22;
    --border: #25262e;
    --text: #e8e8ec;
    --muted: #7d7e88;
    --accent: oklch(0.74 0.13 290);
    --rust: oklch(0.7 0.16 30);
    --async-c: oklch(0.72 0.14 240);
    --memory-c: oklch(0.78 0.14 165);
    --systems-c: oklch(0.78 0.16 80);
    --html-c: oklch(0.74 0.16 320);
    --philosophy-c: oklch(0.72 0.05 280);
    --sans: 'Geist', -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  .nav-back {
    position: fixed; top: 14px; left: 14px; z-index: 100;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); text-decoration: none;
    padding: 6px 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px;
  }
  .nav-back:hover { color: var(--text); border-color: var(--accent); }

  /* TOP BAR */
  .topbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 90;
    display: flex; gap: 0; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .topbar .mode {
    font-family: var(--mono); font-size: 11px;
    padding: 6px 12px; border-radius: 5px;
    color: var(--muted); cursor: pointer;
    background: transparent;
    text-transform: uppercase; letter-spacing: 0.06em;
    border: 0;
  }
  .topbar .mode.is-on { background: var(--panel-2); color: var(--accent); }
  .topbar .mode:hover { color: var(--text); }
  .topbar .sep { width: 1px; height: 20px; background: var(--border); }
  .topbar .filter {
    font-family: var(--mono); font-size: 11px;
    padding: 6px 10px;
    color: var(--muted); cursor: pointer;
    border-radius: 5px; display: inline-flex; gap: 6px; align-items: center;
  }
  .topbar .filter:hover { color: var(--text); }
  .topbar .filter .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .topbar .filter.is-on { color: var(--text); background: var(--panel-2); }

  /* MINIMAP / ZOOM CONTROLS */
  .controls {
    position: fixed; bottom: 18px; right: 18px; z-index: 90;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .controls button {
    width: 36px; height: 36px;
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; font-family: var(--mono); font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .controls button:last-child { border-bottom: 0; }
  .controls button:hover { color: var(--text); background: var(--panel-2); }
  .zoom-readout {
    position: fixed; bottom: 18px; left: 18px; z-index: 90;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 5px;
  }

  /* CANVAS */
  .canvas {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
    background:
      radial-gradient(circle at 30% 40%, color-mix(in oklch, var(--accent) 8%, transparent), transparent 60%),
      radial-gradient(circle at 70% 70%, color-mix(in oklch, var(--memory-c) 6%, transparent), transparent 60%),
      var(--bg);
  }
  .canvas:active { cursor: grabbing; }
  .canvas .grid-bg {
    position: absolute; inset: -2000px;
    background-image:
      radial-gradient(circle, var(--border) 1px, transparent 1.5px);
    background-size: 32px 32px;
    opacity: 0.5;
    pointer-events: none;
    transform-origin: 0 0;
  }
  .surface {
    position: absolute; left: 50%; top: 50%;
    transform-origin: 0 0;
    width: 0; height: 0;
  }

  /* CARDS */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    width: 260px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    user-select: none;
  }
  .node:hover {
    border-color: var(--node-color, var(--accent));
    z-index: 5;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .node .tag-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--node-color, var(--muted));
    display: inline-block; margin-right: 6px;
  }
  .node .top {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .node .top .id { color: var(--node-color, var(--accent)); }
  .node h3 {
    font-family: var(--sans);
    font-size: 15.5px; line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text); font-weight: 500;
  }
  .node p {
    font-family: var(--sans);
    font-size: 12px; line-height: 1.45;
    color: var(--muted); margin: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .node .feet {
    margin-top: 10px;
    display: flex; gap: 6px;
    font-family: var(--mono); font-size: 10px;
    color: var(--muted);
  }
  .node .feet .pill { padding: 1px 6px; border: 1px solid var(--border); border-radius: 999px; }

  .node.is-flagship { width: 320px; transform: translate(-50%, -50%) scale(1.05); border-width: 1.5px; }
  .node.is-flagship h3 { font-size: 18px; }
  .node.is-flagship p { -webkit-line-clamp: 3; }
  .node.dim { opacity: 0.25; }
  .node.is-focused { border-color: var(--node-color); box-shadow: 0 0 0 3px color-mix(in oklch, var(--node-color, var(--accent)) 25%, transparent); }

  /* EDGES */
  .edges { position: absolute; left: 50%; top: 50%; pointer-events: none; transform-origin: 0 0; overflow: visible; width: 0; height: 0; }

  /* CLUSTER LABELS */
  .cluster-label {
    position: absolute;
    transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 11px;
    color: var(--node-color, var(--muted));
    text-transform: uppercase; letter-spacing: 0.16em;
    opacity: 0.6;
    pointer-events: none;
    white-space: nowrap;
  }
  .cluster-label::before, .cluster-label::after { content: '·'; margin: 0 8px; }

  /* DETAIL OVERLAY */
  .detail-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    display: none;
    z-index: 200;
    padding: 24px;
  }
  body.is-detail .detail-overlay { display: grid; place-items: center; }
  .detail-card {
    width: 100%; height: 100%;
    max-width: 1280px; max-height: 800px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: grid; grid-template-rows: auto 1fr;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .detail-head {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .detail-head .close { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; padding: 6px 10px; }
  .detail-head .close:hover { color: var(--text); }
  .detail-head .crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .detail-head .crumb .accent { color: var(--accent); }
  .detail-head h2 { margin: 0; font-size: 17px; font-weight: 500; flex: 1; }
  .detail-head .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .detail-body { display: grid; grid-template-columns: 1fr 280px; overflow: hidden; }
  .detail-body iframe { width: 100%; height: 100%; border: 0; background: white; }
  .detail-side {
    border-left: 1px solid var(--border);
    padding: 16px 18px; overflow-y: auto;
    background: var(--panel-2);
  }
  .detail-side h4 { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; font-weight: 500; }
  .detail-side h4:not(:first-child) { margin-top: 22px; }
  .detail-side .neighbor {
    display: block; padding: 8px 10px;
    border-radius: 5px; cursor: pointer;
    margin-bottom: 4px; text-decoration: none;
  }
  .detail-side .neighbor:hover { background: var(--panel); }
  .detail-side .neighbor h5 { margin: 0; color: var(--text); font-size: 13px; font-weight: 500; line-height: 1.25; }
  .detail-side .neighbor small { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  .detail-side .tag-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .detail-side .tag { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); }
</style>
</head>
<body>
<a class="nav-back" href="../Layouts.html">← layouts</a>

<div class="topbar">
  <button class="mode is-on">spatial</button>
  <button class="mode">force</button>
  <button class="mode">timeline</button>
  <span class="sep"></span>
  <span class="filter is-on"><span class="swatch" style="background: var(--rust)"></span>rust</span>
  <span class="filter is-on"><span class="swatch" style="background: var(--async-c)"></span>async</span>
  <span class="filter is-on"><span class="swatch" style="background: var(--memory-c)"></span>memory</span>
  <span class="filter is-on"><span class="swatch" style="background: var(--systems-c)"></span>systems</span>
  <span class="filter is-on"><span class="swatch" style="background: var(--html-c)"></span>html</span>
  <span class="filter is-on"><span class="swatch" style="background: var(--philosophy-c)"></span>philosophy</span>
</div>

<div class="canvas" id="canvas">
  <div class="grid-bg" id="grid"></div>
  <svg class="edges" id="edges" width="2000" height="2000" style="left: -1000px; top: -1000px;"></svg>
  <div class="surface" id="surface"></div>
</div>

<div class="zoom-readout"><span id="zoomNum">100</span>% · drag to pan · scroll to zoom</div>
<div class="controls">
  <button id="zin">+</button>
  <button id="zout">−</button>
  <button id="ztr" title="fit">⊡</button>
</div>

<div class="detail-overlay" id="overlay">
  <div class="detail-card">
    <div class="detail-head">
      <button class="close" id="close-d">×</button>
      <span class="crumb"><span class="accent">kb/work</span> › <span id="d-id">—</span></span>
      <h2 id="d-title">—</h2>
      <span class="meta"><span id="d-age">—</span> · <span id="d-words">—</span></span>
    </div>
    <div class="detail-body">
      <iframe id="d-iframe" src="about:blank"></iframe>
      <aside class="detail-side">
        <h4>tags</h4>
        <div class="tag-row" id="d-tags"></div>
        <h4>nearest neighbors</h4>
        <div id="d-neighbors"></div>
      </aside>
    </div>
  </div>
</div>

<script>
  // Nodes positioned in a coordinate system (px), clustered by tag
  const NODES = [
    // RUST cluster (center)
    { id: 's01', x: -160, y: -40,  c: 'memory-c', tag: 'memory',  flagship: true,  title: 'Visualizing the Borrow Checker', summary: 'Three rules, one picture: drag a scope, watch lifetimes resolve in real time. A small tool for a famously hard question.', tags: ['rust','memory','ownership'], age: '3h', words: 240, src: '../artifacts/fullscreen-viz.html' },
    { id: 's02', x: 280,  y: -180, c: 'rust',     tag: 'rust',    flagship: true,  title: 'A Field Guide to Rust Errors', summary: 'Four chapters on panics, Result, the Error trait, and patterns. Internal nav, sticky TOC, no scroll marathon.', tags: ['rust','errors'], age: '1d', words: 6800, src: '../artifacts/multi-page.html' },
    { id: 's03', x: 100,  y: 320,  c: 'systems-c',tag: 'systems', flagship: true,  title: 'Everything HTML Can Do, in One Page', summary: 'Native dialogs, sortable tables, drag-to-reorder, copyable code, popovers — eleven interactions, no framework.', tags: ['html','systems'], age: '5h', words: 3200, src: '../artifacts/kitchen-sink.html' },

    { id: 'o2',  x: 120,  y: -260, c: 'async-c',  tag: 'async',   title: 'Async error propagation, the ergonomic version', summary: 'How ?, map_err, and thiserror compose into something a person can read.', tags: ['async','errors'], age: '4d', words: 2100 },
    { id: 'o3',  x: 460,  y: -40,  c: 'async-c',  tag: 'async',   flagship: true, title: 'The Tokio runtime, stripped to its frame', summary: 'What stays after you remove the schedulers, the timers, and the work-stealing — and what each does.', tags: ['async','tokio'], age: '1w', words: 3600 },
    { id: 'o4',  x: 540,  y: -260, c: 'async-c',  tag: 'async',   title: 'Pin, in fewer than fifteen sentences', summary: 'The shortest legitimate explanation, written for someone who has given up twice.', tags: ['async','pin'], age: '2w', words: 580 },
    { id: 'o7',  x: 680,  y: 60,   c: 'async-c',  tag: 'async',   title: 'How the executor came to be', summary: 'From std::future to async fn: seven RFCs across five years.', tags: ['async','history'], age: '1mo', words: 4400 },

    { id: 'o6',  x: -460, y: 60,   c: 'memory-c', tag: 'memory',  title: 'Every smart pointer, charted', summary: 'Box, Rc, Arc, RefCell, Cell, Mutex, RwLock — what each owns, shares, costs.', tags: ['memory','pointers'], age: '1mo', words: 2800 },
    { id: 'o5',  x: -340, y: 280,  c: 'memory-c', tag: 'memory',  title: 'BTreeMap, drawn at 50× zoom', summary: 'An interactive view of the tree as you insert and delete keys. Watch nodes split.', tags: ['data','visual'], age: '3w', words: 0 },

    { id: 'o1',  x: -60,  y: 540,  c: 'html-c',   tag: 'html',    title: 'The unreasonable effectiveness of static HTML', summary: 'Why the kb’s primary unit is a file, not a page. From durability, forkability, no build step.', tags: ['html','philosophy'], age: '2d', words: 1400 },
    { id: 'o8',  x: -420, y: -240, c: 'rust',     tag: 'rust',    title: 'The macro system, in one page', summary: 'Declarative vs procedural, hygiene, why macro_rules! is enough 90% of the time.', tags: ['macros'], age: '2mo', words: 1900 },
    { id: 'o9',  x: 360,  y: 460,  c: 'philosophy-c', tag: 'philosophy', title: 'Notes on writing slow software on purpose', summary: 'An argument that the kb is a place for thinking, and thinking should not load instantly.', tags: ['philosophy'], age: '2mo', words: 920 },
  ];

  const EDGES = [
    ['s01','o6'], ['s01','o5'], ['s01','s02'],
    ['s02','o2'], ['s02','o3'], ['s02','o4'],
    ['o3','o4'], ['o3','o7'], ['o4','o7'],
    ['o6','o5'], ['o6','o8'],
    ['s03','o1'], ['s03','o9'],
    ['o1','o9'],
    ['s01','o4'], ['s02','o7'],
  ];

  const CLUSTERS = [
    { label: 'rust · ownership', x: -300, y: -60, c: 'memory-c' },
    { label: 'async runtimes',   x: 540, y: -50, c: 'async-c' },
    { label: 'systems · html',   x: 50,  y: 440, c: 'systems-c' },
    { label: 'philosophy',       x: 200, y: 580, c: 'philosophy-c' },
  ];

  const surface = document.getElementById('surface');
  const edgesSvg = document.getElementById('edges');
  const grid = document.getElementById('grid');
  const canvas = document.getElementById('canvas');

  // Render cluster labels
  CLUSTERS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cluster-label';
    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
    el.style.setProperty('--node-color', `var(--${c.c})`);
    el.textContent = c.label;
    surface.appendChild(el);
  });

  // Render nodes
  const byId = {};
  NODES.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node' + (n.flagship ? ' is-flagship' : '');
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    el.style.setProperty('--node-color', `var(--${n.c})`);
    el.dataset.id = n.id;
    el.innerHTML = `
      <div class="top"><span class="id">${n.id}</span><span><span class="tag-dot"></span>${n.tag}</span></div>
      <h3>${n.title}</h3>
      <p>${n.summary}</p>
      <div class="feet"><span class="pill">${n.age}</span><span class="pill">${n.words ? n.words.toLocaleString() + 'w' : 'interactive'}</span></div>
    `;
    el.addEventListener('click', () => openNode(n.id));
    surface.appendChild(el);
    byId[n.id] = n;
  });

  // Render edges
  EDGES.forEach(([a, b]) => {
    const na = byId[a], nb = byId[b]; if (!na || !nb) return;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mx = (na.x + nb.x) / 2, my = (na.y + nb.y) / 2;
    const cx = mx + (nb.y - na.y) * 0.15, cy = my - (nb.x - na.x) * 0.15;
    p.setAttribute('d', `M ${1000+na.x} ${1000+na.y} Q ${1000+cx} ${1000+cy} ${1000+nb.x} ${1000+nb.y}`);
    p.setAttribute('stroke', 'rgba(160,160,180,0.18)');
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', '1');
    edgesSvg.appendChild(p);
  });

  // Pan + zoom
  let zoom = 1, panX = 0, panY = 0;
  function update() {
    surface.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    edgesSvg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    grid.style.transform = `translate(${panX % 32}px, ${panY % 32}px) scale(${zoom})`;
    document.getElementById('zoomNum').textContent = Math.round(zoom * 100);
  }
  let dragging = false, sx = 0, sy = 0, dpx = 0, dpy = 0;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.node')) return;
    dragging = true; sx = e.clientX; sy = e.clientY; dpx = panX; dpy = panY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    panX = dpx + (e.clientX - sx);
    panY = dpy + (e.clientY - sy);
    update();
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.92 : 1.08;
    const r = canvas.getBoundingClientRect();
    const cx = e.clientX - r.left - r.width / 2;
    const cy = e.clientY - r.top - r.height / 2;
    const oldZoom = zoom;
    zoom = Math.max(0.3, Math.min(2.5, zoom * factor));
    panX = cx - (cx - panX) * (zoom / oldZoom);
    panY = cy - (cy - panY) * (zoom / oldZoom);
    update();
  }, { passive: false });
  document.getElementById('zin').onclick = () => { zoom = Math.min(2.5, zoom * 1.2); update(); };
  document.getElementById('zout').onclick = () => { zoom = Math.max(0.3, zoom * 0.83); update(); };
  document.getElementById('ztr').onclick = () => { zoom = 1; panX = 0; panY = 0; update(); };
  update();

  // Detail overlay
  function openNode(id) {
    const n = byId[id]; if (!n) return;
    document.body.classList.add('is-detail');
    document.getElementById('d-id').textContent = id;
    document.getElementById('d-title').textContent = n.title;
    document.getElementById('d-age').textContent = n.age;
    document.getElementById('d-words').textContent = n.words ? n.words.toLocaleString() + ' words' : 'interactive';
    const ifr = document.getElementById('d-iframe');
    if (n.src) { ifr.removeAttribute('srcdoc'); ifr.src = n.src; }
    else {
      ifr.removeAttribute('src');
      ifr.srcdoc = `<!doctype html><html><head><style>body{font-family:'Geist',sans-serif;background:#15161a;color:#e8e8ec;padding:36px 56px;line-height:1.55;font-size:14px;}h1{font-size:32px;margin:0 0 14px;letter-spacing:-0.02em;font-weight:500;}p{max-width:640px;color:#7d7e88;font-size:16px;margin:0 0 14px;}p.lede{color:#e8e8ec;font-size:18px;}</style></head><body><h1>${n.title}</h1><p class="lede">${n.summary}</p><p>Synthetic placeholder · ${n.words ? n.words.toLocaleString() + ' words' : 'interactive'}. The real artifact would be served from /api/v1/raw/${n.id}.</p></body></html>`;
    }
    const tagBox = document.getElementById('d-tags');
    tagBox.innerHTML = '';
    n.tags.forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tagBox.appendChild(s); });
    const nb = document.getElementById('d-neighbors');
    nb.innerHTML = '';
    const neighbors = NODES.filter(x => x.id !== n.id && x.tags.some(t => n.tags.includes(t))).slice(0, 5);
    neighbors.forEach(x => {
      const a = document.createElement('a');
      a.className = 'neighbor';
      a.innerHTML = `<h5>${x.title}</h5><small>${x.tag} · ${x.age}</small>`;
      a.onclick = (e) => { e.preventDefault(); openNode(x.id); };
      nb.appendChild(a);
    });
  }
  document.getElementById('close-d').onclick = () => document.body.classList.remove('is-detail');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.body.classList.remove('is-detail'); });
</script>
</body>
</html>
