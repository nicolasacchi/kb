<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The SECOND Vite entry (vite.config.ts build.rollupOptions.input).
         Loaded ONLY inside `<iframe sandbox="allow-scripts">` from the slate
         board, so it has an opaque origin: no cookies, no storage, no parent
         DOM. It bundles mermaid; the SPA bundle does not. -->
    <title>sketch</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; padding: 0; background: transparent; }
      body {
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #c9c9d2;
      }
      #root { padding: 8px; overflow: auto; }
      #root svg { max-width: 100%; height: auto; display: block; }
      .sketch-err {
        margin: 0;
        padding: 8px 10px;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #d88;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sketch/main.ts"></script>
  </body>
</html>
